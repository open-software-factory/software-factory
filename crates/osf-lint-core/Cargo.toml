[package]
name = "osf-lint-core"
version = "0.1.0"
edition = "2021"
description = "Reusable engine for Open Software Factory linters: findings, known names, text segmentation, and output rendering"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/open-software-factory/software-factory"
homepage = "https://github.com/open-software-factory/software-factory"
rust-version = "1.85"

[lints]
workspace = true

[dependencies]
annotate-snippets = "0.12.16"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-sarif = "0.8.0"
pulldown-cmark = "0.13.4"
toml = "=1.1.6"
