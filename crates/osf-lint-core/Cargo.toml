[package]
name = "osf-lint-core"
version = "0.1.0"
edition = "2021"
description = "Reusable engine for Open Software Factory linters: findings, known names, text segmentation, and output rendering"
license = "MIT"
rust-version = "1.85"

[lints]
workspace = true

[dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-sarif = "0.8.0"
