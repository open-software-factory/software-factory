[package]
name = "osf"
version = "0.1.0"
edition = "2021"
description = "Open Software Factory command line: deterministic checks that run before an agent's work is accepted"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/open-software-factory/software-factory"
homepage = "https://github.com/open-software-factory/software-factory"
rust-version = "1.85"

[[bin]]
name = "osf"
path = "src/main.rs"

[features]
# Builds the tests that start a real coding agent, which needs its command on PATH.
real-agents = []

[lints]
workspace = true

[dependencies]
osf-lint-core = { path = "../osf-lint-core" }
clap = { version = "4.5", features = ["derive"] }
globset = "=0.4.20"
jsonschema = { version = "=0.30.0", default-features = false }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "=1.0.28"
shlex = "=2.0.1"
sha2 = "0.11"
toml = "=1.1.6"
typed-path = "0.12"
url = "2.5"
agnix-core = "=0.54.0"
wait-timeout = "0.2"
tree-sitter = "=0.25.10"
tree-sitter-rust = "=0.24.2"
pulldown-cmark = { version = "=0.13.4", default-features = false }
