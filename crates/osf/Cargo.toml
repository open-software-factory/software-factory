[package]
name = "osf"
version = "0.1.0"
edition = "2021"
description = "Open Software Factory command line: deterministic checks that run before an agent's work is accepted"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/open-software-factory/software-factory"
homepage = "https://github.com/open-software-factory/software-factory"
rust-version = "1.85"

[[bin]]
name = "osf"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
osf-lint-core = { path = "../osf-lint-core" }
clap = { version = "4.5", features = ["derive"] }
globset = "=0.4.20"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "=1.1.6"
typed-path = "0.12"
url = "2.5"
agnix-core = "=0.54.0"
wait-timeout = "0.2"
