[package]
name = "osf"
version = "0.1.0"
edition = "2021"
description = "Open Software Factory command line: deterministic checks that run before an agent's work is accepted"
license = "MIT"
rust-version = "1.85"

[[bin]]
name = "osf"
path = "src/main.rs"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
indexing_slicing = "warn"
must_use_candidate = "allow"
module_name_repetitions = "allow"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
