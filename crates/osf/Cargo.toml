[package]
name = "osf"
version = "0.1.0"
edition = "2021"
description = "Open Software Factory command line: deterministic checks that run before an agent's work is accepted"
license = "MIT"
rust-version = "1.85"

[[bin]]
name = "osf"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
osf-lint-core = { path = "../osf-lint-core" }
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
