# The shipped reviewer roster: one coding-agent harness per row, run
# headless with osf's own lens prompt and answer schema. Every entry ships
# disabled; a repository's own osf.toml turns one on once its harness is
# installed and logged in.
#
# osf never holds a model provider's key. Each harness reads its own
# credentials (a subscription login, or its own API key environment
# variable) the way it already does outside osf.
#
# The prompt is always sent on the harness's own standard input; a harness
# whose command line needs the prompt as a file instead can use the
# `{prompt_file}` token in its own `command`.

[[reviewer]]
name = "codex"
harness = "codex"
family = "openai"
# No --json: that flag turns stdout into a JSON Lines event stream. With
# --output-schema alone, codex exec still writes the final, schema-matching
# message straight to stdout, so no envelope pointer is needed.
command = ["codex", "exec"]
schema_flag = "--output-schema"
schema_as = "path"
# codex exec's own --model/-m flag; left unset here so codex uses its own default model.
model_flag = "--model"
credential_env = ["OPENAI_API_KEY"]
enabled = false

[[reviewer]]
name = "claude-code"
harness = "claude"
family = "anthropic"
# --json-schema only takes effect together with --output-format json; the
# schema-matching answer then comes back under the envelope's own
# structured_output field, not as the whole output.
command = ["claude", "--print", "--output-format", "json"]
schema_flag = "--json-schema"
schema_as = "inline"
answer_pointer = "/structured_output"
# claude's own --model flag; left unset here so claude uses its own default model.
model_flag = "--model"
# claude reads either its own subscription token or an Anthropic API key.
credential_env = ["CLAUDE_CODE_OAUTH_TOKEN", "ANTHROPIC_API_KEY"]
enabled = false

[[reviewer]]
name = "dsh"
harness = "dsh"
family = "deepseek"
# DeepSeek Harness's headless profile has no model flag of its own: it
# always answers with the model its profile is already configured for.
command = ["dsh", "--profile", "headless"]
credential_env = ["DEEPSEEK_API_KEY"]
enabled = false

# omp is built on pi and, like it, runs many model families rather than one
# fixed provider, so its own family is its own name, not a model's.
# credential_env is left empty until a deployment names the variable it
# reads; adopters enabling this repeat its whole shape with that filled in.
[[reviewer]]
name = "omp"
harness = "omp"
family = "omp"
command = ["omp"]
enabled = false

# The four opencode variants below all reach their model through
# OpenRouter, so they share its one credential variable.

[[reviewer]]
name = "opencode-glm"
harness = "opencode"
family = "glm"
# opencode run's own --model/-m flag, in its "provider/model" shape.
command = ["opencode", "run", "--format", "json"]
model_flag = "--model"
model = "zhipuai/glm"
credential_env = ["OPENROUTER_API_KEY"]
enabled = false

[[reviewer]]
name = "opencode-kimi"
harness = "opencode"
family = "kimi"
command = ["opencode", "run", "--format", "json"]
model_flag = "--model"
model = "moonshotai/kimi"
credential_env = ["OPENROUTER_API_KEY"]
enabled = false

[[reviewer]]
name = "opencode-qwen"
harness = "opencode"
family = "qwen"
command = ["opencode", "run", "--format", "json"]
model_flag = "--model"
model = "alibaba/qwen"
credential_env = ["OPENROUTER_API_KEY"]
enabled = false

[[reviewer]]
name = "opencode-mimo"
harness = "opencode"
family = "mimo"
command = ["opencode", "run", "--format", "json"]
model_flag = "--model"
model = "xiaomi/mimo"
credential_env = ["OPENROUTER_API_KEY"]
enabled = false
