# Settings for this repository.
#
# Every gate and every contributor runs against these numbers, so they live
# here rather than in one person's home directory. A check that passes on your
# machine and fails on a pull request is worse than no check.

[scan]
# A reference such as other-owner/other-repo#<number> means nothing to a reader here.
project_owner = "open-software-factory"
# Stated here so the scan never asks the host on every commit. It changes no
# rule: every rule applies whether a repository is public or private.
repository_visibility = "public"

[writing]
# Real tools this repository names in its own docs, plainly spelled, with
# no internal capital, digit, or domain suffix to give the writing lint's
# undefined-name rule anything to go on by itself. Read even under --gate;
# see gate_loaded in crates/osf/src/config.rs for why that is safe.
#
#   - Linear: an issue tracker, docs/architecture/open-questions.md:54 and
#     docs/research/ux/ux-references.md:123.
#   - Canny: a feedback-management tool, docs/vision/product-lifecycle.md:423.
#   - Figma: a design tool, named repeatedly across
#     docs/research/ux/design-workflow-landscape.md and
#     docs/vision/product-lifecycle.md.
#   - Jira: an issue tracker, docs/architecture/open-questions.md:54.
#   - Intercom: a support and feedback tool, docs/vision/product-lifecycle.md:426.
#   - Zendesk: a support and feedback tool, docs/vision/product-lifecycle.md:426.
must_explain_names = ["Linear", "Canny", "Figma", "Jira", "Intercom", "Zendesk"]

[review]
# A roster entry replaces a shipped one of the same name in full, so
# enabling a shipped reviewer still means repeating its whole shape
# here, not just its name and `enabled`. See crates/osf/src/reviewers.rs
# and crates/osf/defaults/review-roster.toml for the shipped shape each
# entry below copies, and docs/development.md for the reviewer table.

# codex reads its key from OPENAI_API_KEY (or CODEX_API_KEY), the same
# variable the review workflow already sets for this job.
# model is left unset: codex uses its own default model. Pin one with
# model = "<model-id>" (codex exec's own --model/-m flag).
[[review.roster]]
name = "codex"
harness = "codex"
family = "openai"
command = ["codex", "exec"]
schema_flag = "--output-schema"
schema_as = "path"
model_flag = "--model"
enabled = true

# claude reads its key from ANTHROPIC_API_KEY, the same variable the
# review workflow already sets for this job.
# model is left unset: claude uses its own default model. Pin one with
# model = "<model-id>" (claude's own --model flag).
[[review.roster]]
name = "claude-code"
harness = "claude"
family = "anthropic"
command = ["claude", "--print", "--output-format", "json"]
schema_flag = "--json-schema"
schema_as = "inline"
answer_pointer = "/structured_output"
model_flag = "--model"
enabled = true

# dsh reads its key from DEEPSEEK_API_KEY. Its headless profile takes
# the task as a command-line argument, not on standard input, so this
# entry reads the prompt file itself and passes its contents as that
# argument, through a small shell wrapper.
# model is left unset: DeepSeek Harness's headless profile has no model
# flag of its own, so it always answers with its profile's own model.
[[review.roster]]
name = "dsh"
harness = "dsh"
family = "deepseek"
command = ["sh", "-c", 'exec dsh --profile headless "$(cat "$1")"', "sh", "{prompt_file}"]
enabled = true
