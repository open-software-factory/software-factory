name: pr-lens

# Draws a pr-lens diagram of a code change into the pull request
# description. Runs from the base branch, per decision 0020, since it
# holds a model API key; it never checks out or runs the pull request's
# own code, only its diff, fetched as data.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write # push the rendered SVGs to the orphan pr-lens branch
  pull-requests: write # rewrite the pr-lens section of the description

concurrency:
  group: pr-lens-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLI_VERSION: 0.13.0
  PR_LENS_PROVIDER: ${{ vars.PR_LENS_PROVIDER || 'deepseek' }}

jobs:
  diagram:
    name: pr-lens
    runs-on: ubuntu-latest
    environment: review # the model key, when an adopter sets one, lives here
    steps:
      # The allow-list names every provider host, since it applies to the
      # whole job: a retry with another provider needs its host open too.
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            registry.npmjs.org:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443
            api.deepseek.com:443
            api.openai.com:443
            api.anthropic.com:443

      # One place mapping a provider name to the CLI flags it needs. It
      # picks up to two providers that have a key: the configured one first
      # when it has a key, then the others in a fixed order. The second is
      # the one retry when the first fails. PR_LENS_MODEL names a model for
      # the configured provider only; another provider uses its own default.
      # The openai row has no default model, since none is verified against
      # the org's key. It is tried only when a model is set: the repository
      # variable PR_LENS_OPENAI_MODEL, or PR_LENS_MODEL when openai is the
      # configured provider. With a key but no model it is skipped, and the
      # skip is named in the note. OpenAI reasoning models reject a fixed
      # temperature, so its row asks the CLI to send none.
      - name: Resolve the model providers
        id: provider
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL_OVERRIDE: ${{ vars.PR_LENS_MODEL }}
          OPENAI_MODEL: ${{ vars.PR_LENS_OPENAI_MODEL }}
        run: |
          set -euo pipefail
          # cli provider | base url | default model | key variable | temperature
          table() {
            case "$1" in
              deepseek) echo "openai-compatible|https://api.deepseek.com|deepseek-chat|DEEPSEEK_API_KEY|0" ;;
              openai) echo "openai|||OPENAI_API_KEY|default" ;;
              anthropic) echo "openai-compatible|https://api.anthropic.com/v1|claude-sonnet-5|ANTHROPIC_API_KEY|0" ;;
              *) return 1 ;;
            esac
          }
          if ! primary_row="$(table "${PR_LENS_PROVIDER}")"; then
            echo "::error::PR_LENS_PROVIDER is '${PR_LENS_PROVIDER}'; supported values are deepseek, openai, anthropic."
            exit 1
          fi
          IFS='|' read -r _ _ _ primary_key_var _ <<< "${primary_row}"
          echo "primary_key_var=${primary_key_var}" >> "$GITHUB_OUTPUT"

          seen=" "
          skipped=""
          slot=0
          for name in "${PR_LENS_PROVIDER}" deepseek openai anthropic; do
            case "${seen}" in *" ${name} "*) continue ;; esac
            seen="${seen}${name} "
            IFS='|' read -r cli base_url model key_var temperature <<< "$(table "${name}")"
            if [ -z "${!key_var:-}" ]; then
              continue
            fi
            if [ "${name}" = "${PR_LENS_PROVIDER}" ] && [ -n "${MODEL_OVERRIDE}" ]; then
              model="${MODEL_OVERRIDE}"
            fi
            if [ "${name}" = openai ] && [ -z "${model}" ]; then
              model="${OPENAI_MODEL}"
            fi
            if [ "${name}" = openai ] && [ -z "${model}" ]; then
              skipped="openai: skipped, no model configured (set PR_LENS_OPENAI_MODEL)"
              continue
            fi
            slot=$((slot + 1))
            if [ "${slot}" -eq 1 ]; then prefix=first; else prefix=second; fi
            {
              echo "${prefix}_name=${name}"
              echo "${prefix}_cli_provider=${cli}"
              echo "${prefix}_base_url=${base_url}"
              echo "${prefix}_model=${model}"
              echo "${prefix}_key_var=${key_var}"
              echo "${prefix}_temperature=${temperature}"
            } >> "$GITHUB_OUTPUT"
            if [ "${slot}" -eq 2 ]; then
              break
            fi
          done
          echo "skipped=${skipped}" >> "$GITHUB_OUTPUT"

      - name: List the changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename' > "${RUNNER_TEMP}/changed-files.txt"
          if grep -qvE '(\.md$|^docs/)' "${RUNNER_TEMP}/changed-files.txt"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip a documentation-only pull request
        if: steps.files.outputs.docs_only == 'true'
        run: echo "::notice::every changed file is documentation; no diagram section is written."

      # Runs for both the note path and the diagram path below, so osf, the
      # tool both steps need, is built either way. Built from the base
      # branch, not the pull request's own tree: this checkout never runs
      # the pull request's own code, only its diff, fetched as data below.
      - name: Check out the pull request's base branch
        if: steps.files.outputs.docs_only == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          # npx runs a third-party package later in this job; it must not
          # find a job token sitting in .git/config while it does.
          persist-credentials: false

      - name: Cache the build
        if: steps.files.outputs.docs_only == 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build osf
        if: steps.files.outputs.docs_only == 'false'
        run: cargo build --release --bin osf

      - name: Write a note in place of a diagram
        if: steps.files.outputs.docs_only == 'false' && steps.provider.outputs.first_name == ''
        env:
          GH_TOKEN: ${{ github.token }}
          SKIPPED: ${{ steps.provider.outputs.skipped }}
        run: |
          set -euo pipefail
          echo "pr-lens has no usable model: add the review environment and a ${{ steps.provider.outputs.primary_key_var }} secret to draw a diagram here. ${SKIPPED}" > "${RUNNER_TEMP}/section.md"
          ./target/release/osf pr section write --pr "${{ github.event.pull_request.number }}" --name pr-lens --head "${{ github.event.pull_request.head.sha }}" --file "${RUNNER_TEMP}/section.md"

      - name: Fetch the pull request's head, as data only
        if: steps.files.outputs.docs_only == 'false' && steps.provider.outputs.first_name != ''
        run: git fetch origin "refs/pull/${{ github.event.pull_request.number }}/head"

      # ubuntu-latest ships Node 22, which meets pr-lens 0.13.0's engines
      # field (>=20.11), so no setup-node step downloads anything here.
      # A review aid, not a gate: a failed model call writes a note below and the check still passes.
      # Each provider is tried with both lenses, then with the architecture
      # lens alone: a long data-flow answer is the likelier to fail
      # validation, and one lens still draws a diagram. When the first
      # provider fails both ways, one retry runs with the second, if any.
      - name: Analyze the diff
        if: steps.files.outputs.docs_only == 'false' && steps.provider.outputs.first_name != ''
        id: analyze
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SKIPPED: ${{ steps.provider.outputs.skipped }}
          FIRST_NAME: ${{ steps.provider.outputs.first_name }}
          FIRST_CLI: ${{ steps.provider.outputs.first_cli_provider }}
          FIRST_BASE_URL: ${{ steps.provider.outputs.first_base_url }}
          FIRST_MODEL: ${{ steps.provider.outputs.first_model }}
          FIRST_KEY_VAR: ${{ steps.provider.outputs.first_key_var }}
          FIRST_TEMPERATURE: ${{ steps.provider.outputs.first_temperature }}
          SECOND_NAME: ${{ steps.provider.outputs.second_name }}
          SECOND_CLI: ${{ steps.provider.outputs.second_cli_provider }}
          SECOND_BASE_URL: ${{ steps.provider.outputs.second_base_url }}
          SECOND_MODEL: ${{ steps.provider.outputs.second_model }}
          SECOND_KEY_VAR: ${{ steps.provider.outputs.second_key_var }}
          SECOND_TEMPERATURE: ${{ steps.provider.outputs.second_temperature }}
        run: |
          set -uo pipefail
          echo "the model call failed before it reported a reason" > "${RUNNER_TEMP}/analyze-reason.txt"

          # args: cli provider, base url, model, key variable, temperature,
          # log file, then any extra flags, such as a single --lens
          attempt() {
            local cli="$1" base_url="$2" model="$3" key_var="$4" temperature="$5" log="$6"
            shift 6
            npx --yes "@coldtea/pr-lens-cli@${CLI_VERSION}" analyze \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head "${{ github.event.pull_request.head.sha }}" \
              --pr "${{ github.event.pull_request.number }}" \
              --provider "${cli}" \
              --api-key-env "${key_var}" \
              --temperature "${temperature}" \
              ${model:+--model "${model}"} \
              ${base_url:+--base-url "${base_url}"} \
              "$@" \
              --out "${RUNNER_TEMP}/pr-lens/graph.json" 2>&1 | tee "${log}"
          }

          # The first line the tool marks with a cross, else a plain fallback.
          reason_of() {
            local line
            if line="$(grep -m1 '✗' "$1")"; then
              printf '%s' "${line}"
            else
              printf 'no reason line in the log'
            fi
          }

          # args: name, cli provider, base url, model, key variable,
          # temperature, log prefix. Tries both lenses, then architecture
          # alone. Sets `reason` to what failed when neither draws.
          try_provider() {
            local name="$1" log="$7"
            if attempt "$2" "$3" "$4" "$5" "$6" "${log}.log"; then
              return 0
            fi
            reason="${name}: $(reason_of "${log}.log")"
            echo "::warning::pr-lens: ${name} failed with both lenses; retrying with the architecture lens alone."
            rm -f "${RUNNER_TEMP}/pr-lens/graph.json"
            if attempt "$2" "$3" "$4" "$5" "$6" "${log}-architecture.log" --lens architecture; then
              return 0
            fi
            reason="${reason} | architecture lens alone: $(reason_of "${log}-architecture.log")"
            return 1
          }

          reason=""
          if try_provider "${FIRST_NAME}" "${FIRST_CLI}" "${FIRST_BASE_URL}" "${FIRST_MODEL}" "${FIRST_KEY_VAR}" "${FIRST_TEMPERATURE}" "${RUNNER_TEMP}/analyze-first"; then
            echo "::notice::pr-lens drew the diagram with ${FIRST_NAME}."
            exit 0
          fi

          if [ -n "${SECOND_NAME}" ]; then
            echo "::warning::pr-lens: ${FIRST_NAME} failed; retrying once with ${SECOND_NAME}."
            rm -f "${RUNNER_TEMP}/pr-lens/graph.json"
            first_reason="${reason}"
            if try_provider "${SECOND_NAME}" "${SECOND_CLI}" "${SECOND_BASE_URL}" "${SECOND_MODEL}" "${SECOND_KEY_VAR}" "${SECOND_TEMPERATURE}" "${RUNNER_TEMP}/analyze-second"; then
              echo "::notice::pr-lens drew the diagram with ${SECOND_NAME}, after ${FIRST_NAME} failed."
              exit 0
            fi
            reason="${first_reason} | retry with ${reason}"
          fi

          printf '%s\n' "${reason}${SKIPPED:+ | ${SKIPPED}}" > "${RUNNER_TEMP}/analyze-reason.txt"
          exit 1

      - name: Write a note when the model call failed
        if: steps.analyze.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reason="no reason was recorded"
          if [ -s "${RUNNER_TEMP}/analyze-reason.txt" ]; then
            reason="$(head -c 500 "${RUNNER_TEMP}/analyze-reason.txt")"
          fi
          printf 'pr-lens could not draw a diagram for this push. The model call failed: %s\n' "${reason}" > "${RUNNER_TEMP}/section.md"
          ./target/release/osf pr section write --pr "${{ github.event.pull_request.number }}" --name pr-lens --head "${{ github.event.pull_request.head.sha }}" --file "${RUNNER_TEMP}/section.md"

      - name: Render the diagrams
        if: steps.analyze.outcome == 'success'
        run: |
          npx --yes "@coldtea/pr-lens-cli@${CLI_VERSION}" render "${RUNNER_TEMP}/pr-lens/graph.json" \
            --out "${RUNNER_TEMP}/pr-lens/assets"

      - name: Publish the SVGs to the pr-lens branch
        if: steps.analyze.outcome == 'success'
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="$(./target/release/osf assets publish \
            --branch pr-lens \
            --path "pr/${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}" \
            --dir "${RUNNER_TEMP}/pr-lens/assets")"
          echo "assets-url=${url}" >> "$GITHUB_OUTPUT"

      - name: Build the diagram section
        if: steps.analyze.outcome == 'success'
        run: |
          set -euo pipefail
          npx --yes "@coldtea/pr-lens-cli@${CLI_VERSION}" comment \
            --graph "${RUNNER_TEMP}/pr-lens/assets/drawn.graph.json" \
            --manifest "${RUNNER_TEMP}/pr-lens/assets/manifest.json" \
            --asset-base-url "${{ steps.publish.outputs.assets-url }}" \
            --out "${RUNNER_TEMP}/section.md"

      - name: Write the diagram section
        if: steps.analyze.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./target/release/osf pr section write --pr "${{ github.event.pull_request.number }}" --name pr-lens --head "${{ github.event.pull_request.head.sha }}" --file "${RUNNER_TEMP}/section.md"
