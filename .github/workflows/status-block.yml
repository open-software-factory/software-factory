name: status block

# check_run events reach a workflow only from the copy of this file on the
# default branch, so that trigger starts working once this file is on
# main. The pull_request and pull_request_review triggers work right away
# from the pull request branch, since GitHub always reads those two from
# the branch the event happened on.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  check_run:
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  # The refresh reads the pull request's check runs and commit statuses,
  # and the host's command line also reads each check's workflow run.
  checks: read
  statuses: read
  actions: read

concurrency:
  group: status-block-${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number }}
  # A newer push supersedes an older one, so cancelling there is right.
  # A completing check must never cancel the run a push started: the
  # cancelled run is reported on the pull request as a failed check, even
  # though a later run refreshed the block.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  refresh:
    name: status block
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'check_run' ||
      (github.event.check_run.name != 'status block' && github.event.check_run.pull_requests[0] != null)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default branch, on every event, never the pull request's own
          # head. This job holds pull-requests: write, so whatever the built
          # binary does runs with a token that can edit the pull request; if
          # that binary were built from the pull request's own branch, its
          # author would control what runs under that token. Building here
          # instead, from the default branch, means only code this
          # repository's own reviewers already merged ever runs with that
          # token. The pull request's tree is fetched separately below, as
          # data for the trusted binary to read, and is never checked out
          # into this directory.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the tool
        run: cargo build -p osf --release

      - name: Fetch the pull request's head, as data only
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          git fetch origin "refs/pull/${PR_NUMBER}/head"
          git worktree add --detach pr-head FETCH_HEAD

      - name: Refresh the status block
        # The risk report diffs the working tree against a base ref, so the
        # binary needs the pull request's files on disk, not just the
        # GitHub API. It reads them from the linked worktree fetched above,
        # never from the checkout the build ran from, so the pull request's
        # own source and build scripts never execute: only the binary built
        # from the default branch runs, and it only reads the pull
        # request's tree, it never builds or executes anything from it.
        working-directory: pr-head
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ${{ github.workspace }}/target/release/osf status refresh --repo ${{ github.repository }}
          --pr ${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number }}
