name: status block

# check_run events reach a workflow only from the copy of this file on the
# default branch, so that trigger starts working once this file is on
# main. The pull_request and pull_request_review triggers work right away
# from the pull request branch, since GitHub always reads those two from
# the branch the event happened on.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  check_run:
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  # The refresh reads the pull request's check runs and commit statuses,
  # and the host's command line also reads each check's workflow run.
  checks: read
  statuses: read
  actions: read

concurrency:
  group: status-block-${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number }}
  cancel-in-progress: true

jobs:
  refresh:
    name: status block
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'check_run' ||
      (github.event.check_run.name != 'status block' && github.event.check_run.pull_requests[0] != null)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's own head, on every event. A check_run event
          # would otherwise check out the default branch, and the risk report
          # would then diff that branch against itself.
          ref: ${{ github.event.pull_request.head.sha || github.event.check_run.head_sha }}
          fetch-depth: 0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the tool
        run: cargo build -p osf --release

      - name: Refresh the status block
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./target/release/osf status refresh --repo ${{ github.repository }}
          --pr ${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number }}
