name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsh-plugin:
    name: dsh-plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/dsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/dsh/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check, lint, and check formatting
        run: npm run check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Cache the build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build the tool
        run: cargo build --release --bin osf

      - name: Scan the files this repository tracks
        env:
          OSF_CONFIG: osf.toml
          OSF_DENYLIST: ${{ secrets.PRIVATE_NAME_DENYLIST }}
        run: ./target/release/osf scan --format human

      - name: Scan the commit messages this change adds
        if: github.event_name == 'pull_request'
        env:
          OSF_CONFIG: osf.toml
          OSF_DENYLIST: ${{ secrets.PRIVATE_NAME_DENYLIST }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "${{ github.base_ref }}"
          ./target/release/osf scan \
            --commits "origin/${{ github.base_ref }}..HEAD" \
            --format human

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # full history so the changed-file list can be computed against the base
          fetch-depth: 0

      - name: Look for a Rust workspace
        id: detect
        run: |
          if [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no Cargo.toml at the repository root, nothing to build yet"
          fi

      - name: Install the toolchain components
        if: steps.detect.outputs.present == 'true'
        run: rustup component add clippy rustfmt

      - name: Cache the build
        if: steps.detect.outputs.present == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check formatting
        if: steps.detect.outputs.present == 'true'
        run: cargo fmt --all --check

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: cargo test --workspace

      - name: Build the tool
        if: steps.detect.outputs.present == 'true'
        run: cargo build --release --bin osf

      # Only what this change touches. A new check does not retroactively
      # condemn every document written before the check existed.
      #
      # This step is not gated on the Rust workspace being present. A change
      # that touches Markdown must always be checked. The only allowed skip
      # is that the change touches no Markdown at all.
      - name: Check the writing in the files this change touches
        if: github.event_name == 'pull_request'
        env:
          WORKSPACE_PRESENT: ${{ steps.detect.outputs.present }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "${{ github.base_ref }}"
          mapfile -t changed < <(
            git diff --name-only --diff-filter=ACMR \
              "origin/${{ github.base_ref }}...HEAD" -- '*.md'
          )
          if [ ${#changed[@]} -eq 0 ]; then
            echo "::notice::this change touches no Markdown"
            exit 0
          fi
          if [ "$WORKSPACE_PRESENT" != 'true' ]; then
            echo "::error::this change touches Markdown, but the writing gate could not run."
            echo "::error::there is no Cargo.toml at the repository root, so the osf tool could not be built."
            echo "::error::rebase this branch onto a commit that has the crate, then push again."
            exit 1
          fi
          printf 'checking %s\n' "${changed[@]}"
          # --no-suppress so a suppression comment cannot hide a finding from this gate
          # --gate so this change's own config file cannot loosen the exclude list
          ./target/release/osf lint writing --no-suppress --gate --format human "${changed[@]}"

      - name: Report the writing across the whole repository
        if: always() && steps.detect.outputs.present == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          find . -name '*.md' -not -path './target/*' -print0 \
            | xargs -0 ./target/release/osf lint writing --no-suppress --gate --format sarif \
            > osf.sarif

      - name: Keep the findings file
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: writing-lint-findings
          path: osf.sarif
          if-no-files-found: ignore
