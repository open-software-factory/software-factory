name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The writing gate reads every tracked Markdown file on every run. These two
  # triggers add a run when no change happens to touch the Markdown.
  workflow_dispatch:
  schedule:
    - cron: '0 19 */2 * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsh-plugin:
    name: dsh-plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/dsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Type-check, lint, and check formatting
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

  console:
    name: console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the placement model
        run: pnpm --filter @open-software-factory/console-model test

      - name: Test the component package
        run: pnpm --filter @open-software-factory/console-ui test

      - name: Build the design lab
        run: pnpm --filter @open-software-factory/console-lab build

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Cache the build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build the tool
        run: cargo build --release --bin osf

      - name: Scan the files this repository tracks
        env:
          OSF_CONFIG: osf.toml
          OSF_DENYLIST: ${{ secrets.PRIVATE_NAME_DENYLIST }}
        run: ./target/release/osf scan --format human --no-suppress

      - name: Scan the commit messages this change adds
        if: github.event_name == 'pull_request'
        env:
          OSF_CONFIG: osf.toml
          OSF_DENYLIST: ${{ secrets.PRIVATE_NAME_DENYLIST }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "${{ github.base_ref }}"
          ./target/release/osf scan \
            --commits "origin/${{ github.base_ref }}..HEAD" \
            --format human

  integrations:
    name: integrations (${{ matrix.folder }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per TypeScript package under integrations/. Adding a
        # package is one line here.
        folder: [opencode, omp]
    defaults:
      run:
        working-directory: integrations/${{ matrix.folder }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: integrations/${{ matrix.folder }}/.nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Type-check, lint, and check formatting
        run: pnpm run check

      - name: Build and test
        run: pnpm test

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Look for a Rust workspace
        id: detect
        run: |
          if [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no Cargo.toml at the repository root, nothing to build yet"
          fi

      - name: Install the toolchain components
        if: steps.detect.outputs.present == 'true'
        run: rustup component add clippy rustfmt

      - name: Cache the build
        if: steps.detect.outputs.present == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check formatting
        if: steps.detect.outputs.present == 'true'
        run: cargo fmt --all --check

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install moon
        if: steps.detect.outputs.present == 'true'
        uses: ./.github/actions/install-moon

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: cargo test --workspace

      - name: Build the tool
        if: steps.detect.outputs.present == 'true'
        run: cargo build --release --bin osf

      # Every skill the repository ships, and every skill an agent uses while
      # working here, every run: skills are few and cheap to check.
      - name: Check the skills
        if: steps.detect.outputs.present == 'true'
        run: |
          set -euo pipefail
          mapfile -t skills < <(git ls-files 'skills/*/SKILL.md' '.agents/skills/*/SKILL.md' | xargs -r -n1 dirname)
          if [ ${#skills[@]} -eq 0 ]; then
            echo "::notice::no skills to check"
            exit 0
          fi
          ./target/release/osf lint skill --format human "${skills[@]}"

      # Claude Code reads only .claude/skills, so that folder must stay a
      # symlink to .agents/skills rather than drift as its own copy.
      - name: Check the Claude Code skills link
        if: steps.detect.outputs.present == 'true'
        run: |
          set -euo pipefail
          mode="$(git ls-files -s .claude/skills | awk '{print $1}')"
          if [ "$mode" != '120000' ]; then
            echo "::error::.claude/skills must be a symlink to ../.agents/skills, but git records it with mode '${mode:-<untracked>}', not a symlink mode of 120000."
            echo "::error::fix: on Windows, run 'git config core.symlinks true' and turn on developer mode first. Then remove .claude/skills, run 'ln -s ../.agents/skills .claude/skills', and commit the result."
            exit 1
          fi
          target="$(readlink .claude/skills)"
          if [ "$target" != '../.agents/skills' ]; then
            echo "::error::.claude/skills links to '$target', not '../.agents/skills'."
            echo "::error::fix: remove .claude/skills, run 'ln -s ../.agents/skills .claude/skills', and commit the result."
            exit 1
          fi

      # The gate reads every tracked Markdown file, on every run. A rule change
      # can flag a file that a pull request does not touch, so the pull request
      # that changes the rule must see those findings.
      #
      # This step is not gated on the Rust workspace being present. Markdown
      # must always be checked. The only allowed skip is a repository with no
      # Markdown at all.
      - name: Check the writing
        env:
          WORKSPACE_PRESENT: ${{ steps.detect.outputs.present }}
        run: |
          set -euo pipefail
          mapfile -t docs < <(git ls-files '*.md')
          echo "scope: every tracked Markdown file"
          if [ ${#docs[@]} -eq 0 ]; then
            echo "::notice::this repository has no Markdown"
            exit 0
          fi
          if [ "$WORKSPACE_PRESENT" != 'true' ]; then
            echo "::error::there is Markdown to check, but the writing gate could not run."
            echo "::error::there is no Cargo.toml at the repository root, so the osf tool could not be built."
            echo "::error::rebase this branch onto a commit that has the crate, then push again."
            exit 1
          fi
          echo "checking ${#docs[@]} files"
          # --no-suppress so a suppression comment cannot hide a finding from this gate
          # --gate so this change's own config file cannot loosen the exclude list
          ./target/release/osf lint writing --no-suppress --gate --format human "${docs[@]}"

      # The same files again, as a findings file for the run's artifacts.
      # The step above is the gate; this one only records what it found, so
      # a non-zero exit here must not fail the job a second time.
      - name: Record the findings as a file
        if: always() && steps.detect.outputs.present == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          git ls-files -z '*.md' \
            | xargs -0 ./target/release/osf lint writing --no-suppress --gate --format sarif \
            > osf.sarif

      - name: Keep the findings file
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: writing-lint-findings
          path: osf.sarif
          if-no-files-found: ignore

  checkpoint:
    name: checkpoint
    # github.base_ref only exists on pull_request events, so this job only runs there.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install the toolchain components
        run: |
          set -euo pipefail
          rustup component add clippy rustfmt

      - name: Cache the build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install moon
        uses: ./.github/actions/install-moon

      - name: Build the tool
        run: |
          set -euo pipefail
          cargo build --release --bin osf

      - name: Put osf on PATH
        run: |
          set -euo pipefail
          echo "${GITHUB_WORKSPACE}/target/release" >> "$GITHUB_PATH"

      - name: Set the state directory
        run: |
          set -euo pipefail
          echo "OSF_STATE_DIR=${RUNNER_TEMP}/osf-state" >> "$GITHUB_ENV"

      - name: Run the pull-request checkpoint
        env:
          OSF_CONFIG: osf.toml
          OSF_DENYLIST: ${{ secrets.PRIVATE_NAME_DENYLIST }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "${{ github.base_ref }}"
          osf verify --checkpoint pull-request --base "origin/${{ github.base_ref }}"

      - name: Keep the checkpoint evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: checkpoint-evidence
          path: |
            ${{ env.OSF_STATE_DIR }}/buffer
            .osf/out
          if-no-files-found: error
