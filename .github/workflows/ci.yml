name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A whole-repository writing pass, on demand and every second day. The
  # everyday gate reads only what a change touches; this catches drift that
  # no change happens to touch, and is the pass to run before a release.
  workflow_dispatch:
    inputs:
      writing_scope:
        description: Which Markdown the writing gate reads
        type: choice
        options: [changed, all]
        default: changed
  schedule:
    - cron: '0 19 */2 * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsh-plugin:
    name: dsh-plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/dsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/dsh/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check, lint, and check formatting
        run: npm run check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Cache the build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build the tool
        run: cargo build --release --bin osf

      - name: Scan the files this repository tracks
        env:
          OSF_CONFIG: osf.toml
          OSF_DENYLIST: ${{ secrets.PRIVATE_NAME_DENYLIST }}
        run: ./target/release/osf scan --format human --no-suppress

      - name: Scan the commit messages this change adds
        if: github.event_name == 'pull_request'
        env:
          OSF_CONFIG: osf.toml
          OSF_DENYLIST: ${{ secrets.PRIVATE_NAME_DENYLIST }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "${{ github.base_ref }}"
          ./target/release/osf scan \
            --commits "origin/${{ github.base_ref }}..HEAD" \
            --format human

  integrations:
    name: integrations (${{ matrix.folder }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per TypeScript package under integrations/. Adding a
        # package is one line here.
        folder: [opencode, omp]
    defaults:
      run:
        working-directory: integrations/${{ matrix.folder }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: integrations/${{ matrix.folder }}/.nvmrc
          cache: npm
          cache-dependency-path: integrations/${{ matrix.folder }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check, lint, and check formatting
        run: npm run check

      - name: Build and test
        run: npm test

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # full history so the changed-file list can be computed against the base
          fetch-depth: 0

      - name: Look for a Rust workspace
        id: detect
        run: |
          if [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no Cargo.toml at the repository root, nothing to build yet"
          fi

      - name: Install the toolchain components
        if: steps.detect.outputs.present == 'true'
        run: rustup component add clippy rustfmt

      - name: Cache the build
        if: steps.detect.outputs.present == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check formatting
        if: steps.detect.outputs.present == 'true'
        run: cargo fmt --all --check

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install moon
        if: steps.detect.outputs.present == 'true'
        uses: ./.github/actions/install-moon

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: cargo test --workspace

      - name: Build the tool
        if: steps.detect.outputs.present == 'true'
        run: cargo build --release --bin osf

      # Two scopes, one gate. `changed` reads only what this change touches
      # and is the everyday cost. `all` reads every tracked Markdown file and
      # is for a release pass, or for the run after a new rule lands. The
      # weekly schedule uses `all`, so drift that no change happens to touch
      # still surfaces.
      #
      # This step is not gated on the Rust workspace being present. Markdown
      # must always be checked. The only allowed skip is a scope that selects
      # no Markdown at all.
      - name: Check the writing
        env:
          WORKSPACE_PRESENT: ${{ steps.detect.outputs.present }}
          SCOPE: ${{ inputs.writing_scope || (github.event_name == 'schedule' && 'all') || 'changed' }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$SCOPE" = 'all' ]; then
            mapfile -t docs < <(git ls-files '*.md')
            echo "scope: every tracked Markdown file"
          elif [ -n "$BASE_REF" ]; then
            git fetch --quiet origin "$BASE_REF"
            mapfile -t docs < <(
              git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- '*.md'
            )
            echo "scope: what this pull request changes against $BASE_REF"
          elif [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            mapfile -t docs < <(
              git diff --name-only --diff-filter=ACMR "$PUSH_BEFORE...HEAD" -- '*.md'
            )
            echo "scope: what this push changes"
          else
            mapfile -t docs < <(git ls-files '*.md')
            echo "scope: every tracked Markdown file, because there is no earlier commit to diff against"
          fi
          if [ ${#docs[@]} -eq 0 ]; then
            echo "::notice::this scope selects no Markdown"
            exit 0
          fi
          if [ "$WORKSPACE_PRESENT" != 'true' ]; then
            echo "::error::there is Markdown to check, but the writing gate could not run."
            echo "::error::there is no Cargo.toml at the repository root, so the osf tool could not be built."
            echo "::error::rebase this branch onto a commit that has the crate, then push again."
            exit 1
          fi
          echo "checking ${#docs[@]} files"
          # --no-suppress so a suppression comment cannot hide a finding from this gate
          # --gate so this change's own config file cannot loosen the exclude list
          ./target/release/osf lint writing --no-suppress --gate --format human "${docs[@]}"

      # The same files again, as a findings file for the run's artifacts.
      # The step above is the gate; this one only records what it found, so
      # a non-zero exit here must not fail the job a second time.
      - name: Record the findings as a file
        if: always() && steps.detect.outputs.present == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          git ls-files -z '*.md' \
            | xargs -0 ./target/release/osf lint writing --no-suppress --gate --format sarif \
            > osf.sarif

      - name: Keep the findings file
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: writing-lint-findings
          path: osf.sarif
          if-no-files-found: ignore

  checkpoint:
    name: checkpoint
    # github.base_ref only exists on pull_request events, so this job only runs there.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install the toolchain components
        run: |
          set -euo pipefail
          rustup component add clippy rustfmt

      - name: Cache the build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install moon
        uses: ./.github/actions/install-moon

      - name: Build the tool
        run: |
          set -euo pipefail
          cargo build --release --bin osf

      - name: Put osf on PATH
        run: |
          set -euo pipefail
          echo "${GITHUB_WORKSPACE}/target/release" >> "$GITHUB_PATH"

      - name: Set the state directory
        run: |
          set -euo pipefail
          echo "OSF_STATE_DIR=${RUNNER_TEMP}/osf-state" >> "$GITHUB_ENV"

      - name: Run the pull-request checkpoint
        env:
          OSF_CONFIG: osf.toml
          OSF_DENYLIST: ${{ secrets.PRIVATE_NAME_DENYLIST }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "${{ github.base_ref }}"
          osf verify --checkpoint pull-request --base "origin/${{ github.base_ref }}"

      - name: Keep the checkpoint evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: checkpoint-evidence
          path: |
            ${{ env.OSF_STATE_DIR }}/buffer
            .osf/out
          if-no-files-found: error

  review:
    name: review
    # A fork's pull request never runs on the self-hosted runner: this
    # guard is true only when the pull request's own head repository is
    # this repository, so a fork's code never reaches it.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, osf-devcontainer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Cache the build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build the tool
        run: cargo build --release --bin osf

      # This runner's main harnesses are already logged in; these keys are
      # only for an optional, cheaper reviewer. osf never reads a key
      # itself, and a missing one just leaves that reviewer unable to answer.
      - name: Run the pull-request review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "${{ github.base_ref }}"
          ./target/release/osf review run \
            --base "origin/${{ github.base_ref }}" \
            --sarif-out review.sarif

      - name: Keep the review findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-findings
          path: review.sarif
          if-no-files-found: ignore
