name: review

# pull_request_target always runs this file from the base branch, so a
# pull request cannot change the job that judges it.
#
# One job builds osf from the base branch, with no secrets. Each reviewer
# then runs in its own job, with only its own provider's key and only its
# own provider's network host. The last job collects the saved answers,
# decides, and posts: it alone gets the code host's token.
#
# This check is advisory. It posts a check run and a review, and no branch
# protection or ruleset requires it. It becomes a required check when the key
# proxy and the network split in open-software-factory/software-factory#208
# land. Reviews run for same-repository pull requests only, and a fork's pull
# request is reviewed only when the OSF_REVIEW_FORKS variable is set to true.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

env:
  # The one place the review image is named. Every job runs this exact image,
  # pinned by digest, and never a moving tag. To change it, open a pull
  # request that edits this value. Take the digest of the manifest list from
  # the build log of the "devcontainer image" workflow run for the commit you
  # want, and have the change reviewed like any workflow change. This image
  # was built from commit e40b471d55747c7ab88a2ea92e3e080c51631317.
  REVIEW_IMAGE: ghcr.io/open-software-factory/devcontainer@sha256:bb1d03e038d6c6290d9ab3cd5f82fe44276938cde4ddd3137bc56b01405ebd68
  # The one place the codex release and its bubblewrap helper are named. A change is reviewed like any workflow change.
  CODEX_VERSION: "0.154.0"
  CODEX_SHA256: "d7e18b2597ae8f242f5f31ee9e90deef48dbc9edd634d9868fb6435d08c07f02"
  CODEX_BWRAP_SHA256: "1e6a0f2802c4199f81e1d3d9a962d64dc274693d8391f02d1f4ab457e57c4c38"

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: review build
    # A same-repository pull request runs on a workflow the pull request
    # cannot change. A fork's pull request runs only once an adopter turns
    # fork review on with the OSF_REVIEW_FORKS variable. This job holds no
    # secret, so it needs no environment. Its token reads issues and pull
    # requests only, to find the work item.
    if: github.event.pull_request.head.repo.full_name == github.repository || vars.OSF_REVIEW_FORKS == 'true'
    runs-on: ${{ fromJSON(vars.OSF_REVIEW_RUNS_ON || '"ubuntu-latest"') }}
    permissions:
      contents: read
      packages: read
      issues: read
      pull-requests: read
    steps:
      # Blocks this job's own outbound network to the hosts below; runs
      # directly on the runner (no job-level container), so this actually
      # covers every step's own network calls, including from docker run.
      - name: Restrict this job's outbound network access
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443

      # OSF_REVIEW_RUNS_ON lets an adopter name any runner, but every step
      # below assumes a Linux runner with a Docker daemon: docker run, and
      # Unix paths such as /base and /pr. State that requirement here,
      # loudly, instead of failing later on the first docker command.
      - name: Require the Linux runner with Docker this workflow assumes
        if: runner.os != 'Linux'
        run: |
          echo "osf review: OSF_REVIEW_RUNS_ON must name a Linux runner; every step after this one assumes docker run and Unix paths such as /base and /pr" >&2
          exit 1

      - name: Log in to ghcr.io to pull the devcontainer image
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check out the base branch, the only code this job runs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          persist-credentials: false

      - name: Build osf from the base branch only, with no cache
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/base:/base"
          -w /base
          ${{ env.REVIEW_IMAGE }}
          cargo build --release --bin osf

      - name: Keep the built osf for the reviewer jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osf-binary
          path: base/target/release/osf
          if-no-files-found: error

      # The codex reviewer job runs the release on the host, so the build job downloads and checks them.
      - name: Download the codex release and its helper and check them
        run: |
          set -euo pipefail
          mkdir -p codex-release
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output codex-release/codex.tar.gz \
            "https://github.com/openai/codex/releases/download/rust-v${CODEX_VERSION}/codex-x86_64-unknown-linux-musl.tar.gz"
          echo "${CODEX_SHA256}  codex-release/codex.tar.gz" | sha256sum --check --strict -
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output codex-release/bwrap.tar.gz \
            "https://github.com/openai/codex/releases/download/rust-v${CODEX_VERSION}/bwrap-x86_64-unknown-linux-musl.tar.gz"
          echo "${CODEX_BWRAP_SHA256}  codex-release/bwrap.tar.gz" | sha256sum --check --strict -

      - name: Keep the codex release for the codex reviewer job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-release
          path: codex-release/codex.tar.gz
          if-no-files-found: error

      - name: Keep the codex sandbox helper for the codex reviewer job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-bwrap
          path: codex-release/bwrap.tar.gz
          if-no-files-found: error

      # The work item is the issue the pull request names on its Issue line,
      # or one it closes. The issue's text is untrusted data, like the pull
      # request's own text, and reviewers receive it only as data.
      - name: Find the work item the pull request names, with read-only access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work-item
          jq '.pull_request | {number, title, body}' "$GITHUB_EVENT_PATH" > work-item/pull-request.json
          docker run --rm \
            -e GH_TOKEN \
            -v "${{ github.workspace }}/base:/base:ro" \
            -v "${{ github.workspace }}/work-item:/work-item" \
            -w /work-item \
            ${{ env.REVIEW_IMAGE }} \
            /base/target/release/osf review work-item \
            --pull-request /work-item/pull-request.json \
            --repository ${{ github.repository }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --out /work-item/work-item.json

      - name: Keep the work item for the reviewer jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: work-item
          path: work-item/work-item.json
          if-no-files-found: error

  review-codex:
    name: review codex
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository || vars.OSF_REVIEW_FORKS == 'true'
    runs-on: ${{ fromJSON(vars.OSF_REVIEW_RUNS_ON || '"ubuntu-latest"') }}
    # The environment holds this reviewer's key. Only main can deploy to
    # `review`, and a maintainer approves `fork-review`, so a branch cannot
    # widen what a review run can see.
    environment: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'review' || 'fork-review' }}
    permissions:
      contents: read
    steps:
      - name: Restrict this job's outbound network access
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            api.openai.com:443

      - name: Require the Linux x86_64 runner this job assumes
        run: |
          if [ "${RUNNER_OS}" != "Linux" ] || [ "$(uname -m)" != "x86_64" ]; then
            echo "osf review: OSF_REVIEW_RUNS_ON must name a Linux x86_64 runner; this job runs the codex release on the host" >&2
            exit 1
          fi

      - name: Check out the base branch, which holds the trusted configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the pull request's head, as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the base commit into the pull request's own checkout
        run: git -C pr fetch --quiet ${{ github.workspace }}/base ${{ github.event.pull_request.base.sha }}

      - name: Fetch the osf that the build job made
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: osf-binary
          path: bin

      - name: Save the pull request's number, title and body
        run: |
          mkdir -p out
          chmod +x bin/osf
          jq '.pull_request | {number, title, body}' "$GITHUB_EVENT_PATH" > out/pull-request.json

      - name: Fetch the work item that the build job saved
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: work-item
          path: work-item

      - name: Fetch the codex release that the build job checked
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-release
          path: codex-release

      - name: Fetch the codex sandbox helper that the build job checked
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-bwrap
          path: codex-bwrap

      - name: Check and install the codex release
        run: |
          set -euo pipefail
          echo "${CODEX_SHA256}  codex-release/codex.tar.gz" | sha256sum --check --strict -
          echo "${CODEX_BWRAP_SHA256}  codex-bwrap/bwrap.tar.gz" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/codex-bin"
          tar -xzf codex-release/codex.tar.gz -C "$RUNNER_TEMP/codex-bin"
          mv "$RUNNER_TEMP/codex-bin/codex-x86_64-unknown-linux-musl" "$RUNNER_TEMP/codex-bin/codex"
          chmod +x "$RUNNER_TEMP/codex-bin/codex"
          mkdir -p "$RUNNER_TEMP/bwrap"
          tar -xzf codex-bwrap/bwrap.tar.gz -C "$RUNNER_TEMP/bwrap"
          mkdir -p "$RUNNER_TEMP/codex-bin/codex-resources"
          mv "$RUNNER_TEMP/bwrap/bwrap-x86_64-unknown-linux-musl" "$RUNNER_TEMP/codex-bin/codex-resources/bwrap"
          chmod +x "$RUNNER_TEMP/codex-bin/codex-resources/bwrap"
          echo "$RUNNER_TEMP/codex-bin" >> "$GITHUB_PATH"
          version=$("$RUNNER_TEMP/codex-bin/codex" --version)
          if [ "$version" != "codex-cli ${CODEX_VERSION}" ]; then
            echo "osf review: codex --version printed ${version}, expected codex-cli ${CODEX_VERSION}" >&2
            exit 1
          fi

      # Codex starts its read-only sandbox with user namespaces. Ubuntu 24.04
      # limits them under AppArmor. This step fails with the reason.
      # It does not change any kernel or AppArmor setting.
      - name: Check that the codex sandbox starts on this runner
        run: |
          home="$RUNNER_TEMP/codex-check-home"
          mkdir -p "$home"
          if output=$(env -i PATH="$PATH" HOME="$home" codex sandbox -- true 2>&1); then
            echo "osf review: the codex sandbox starts on this runner"
            exit 0
          fi
          if restrict=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns); then
            setting="kernel.apparmor_restrict_unprivileged_userns is ${restrict}"
          else
            setting="kernel.apparmor_restrict_unprivileged_userns is not set on this kernel"
          fi
          {
            echo "osf review: the codex sandbox cannot start on this runner, so codex does not review."
            echo "codex said: ${output}"
            echo "${setting}."
            echo "The sandbox needs user namespaces. Ubuntu 24.04 limits them under AppArmor when that setting is 1."
            echo "This workflow does not change that setting. Use a runner whose policy lets codex create user namespaces, or remove codex from the reviewers in osf.toml."
          } >&2
          exit 1

      - name: Run this reviewer, reading the pull request's tree as data
        working-directory: pr
        env:
          # `codex exec` signs in with CODEX_API_KEY; it does not read OPENAI_API_KEY.
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          "$GITHUB_WORKSPACE/bin/osf" review run
          --reviewer codex
          --if-enabled
          --base ${{ github.event.pull_request.base.sha }}
          --config-root "$GITHUB_WORKSPACE/base"
          --pull-request "$GITHUB_WORKSPACE/out/pull-request.json"
          --repository ${{ github.repository }}
          --pull-request-number ${{ github.event.pull_request.number }}
          --head ${{ github.event.pull_request.head.sha }}
          --ci-run-id ${{ github.run_id }}
          --work-item "$GITHUB_WORKSPACE/work-item/work-item.json"
          --out "$GITHUB_WORKSPACE/out/codex.json"

      - name: Keep this reviewer's saved answers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-run-codex
          path: out/codex.json
          if-no-files-found: ignore

  review-claude:
    name: review claude
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository || vars.OSF_REVIEW_FORKS == 'true'
    runs-on: ${{ fromJSON(vars.OSF_REVIEW_RUNS_ON || '"ubuntu-latest"') }}
    environment: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'review' || 'fork-review' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Restrict this job's outbound network access
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            api.anthropic.com:443

      - name: Require the Linux runner with Docker this workflow assumes
        if: runner.os != 'Linux'
        run: |
          echo "osf review: OSF_REVIEW_RUNS_ON must name a Linux runner; every step after this one assumes docker run and Unix paths such as /base and /pr" >&2
          exit 1

      - name: Log in to ghcr.io to pull the devcontainer image
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check out the base branch, which holds the trusted configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the pull request's head, as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the base commit into the pull request's own checkout
        run: git -C pr fetch --quiet ${{ github.workspace }}/base ${{ github.event.pull_request.base.sha }}

      - name: Fetch the osf that the build job made
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: osf-binary
          path: bin

      - name: Save the pull request's number, title and body
        run: |
          mkdir -p out
          chmod +x bin/osf
          jq '.pull_request | {number, title, body}' "$GITHUB_EVENT_PATH" > out/pull-request.json

      - name: Fetch the work item that the build job saved
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: work-item
          path: work-item

      - name: Run this reviewer, reading the pull request's tree as data
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/bin:/osf-bin:ro"
          -v "${{ github.workspace }}/base:/base:ro"
          -v "${{ github.workspace }}/pr:/pr:ro"
          -v "${{ github.workspace }}/work-item:/work-item:ro"
          -v "${{ github.workspace }}/out:/out"
          -w /pr
          -e CLAUDE_CODE_OAUTH_TOKEN
          ${{ env.REVIEW_IMAGE }}
          /osf-bin/osf review run
          --reviewer claude
          --if-enabled
          --base ${{ github.event.pull_request.base.sha }}
          --config-root /base
          --pull-request /out/pull-request.json
          --repository ${{ github.repository }}
          --pull-request-number ${{ github.event.pull_request.number }}
          --head ${{ github.event.pull_request.head.sha }}
          --ci-run-id ${{ github.run_id }}
          --work-item /work-item/work-item.json
          --out /out/claude.json

      - name: Keep this reviewer's saved answers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-run-claude
          path: out/claude.json
          if-no-files-found: ignore

  review-opencode:
    name: review opencode
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository || vars.OSF_REVIEW_FORKS == 'true'
    runs-on: ${{ fromJSON(vars.OSF_REVIEW_RUNS_ON || '"ubuntu-latest"') }}
    environment: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'review' || 'fork-review' }}
    permissions:
      contents: read
      packages: read
    steps:
      # opencode reads its model catalogue from models.opencode.ai at start.
      - name: Restrict this job's outbound network access
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            openrouter.ai:443
            models.opencode.ai:443

      - name: Require the Linux runner with Docker this workflow assumes
        if: runner.os != 'Linux'
        run: |
          echo "osf review: OSF_REVIEW_RUNS_ON must name a Linux runner; every step after this one assumes docker run and Unix paths such as /base and /pr" >&2
          exit 1

      - name: Log in to ghcr.io to pull the devcontainer image
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check out the base branch, which holds the trusted configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the pull request's head, as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the base commit into the pull request's own checkout
        run: git -C pr fetch --quiet ${{ github.workspace }}/base ${{ github.event.pull_request.base.sha }}

      - name: Fetch the osf that the build job made
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: osf-binary
          path: bin

      - name: Save the pull request's number, title and body
        run: |
          mkdir -p out
          chmod +x bin/osf
          jq '.pull_request | {number, title, body}' "$GITHUB_EVENT_PATH" > out/pull-request.json

      - name: Fetch the work item that the build job saved
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: work-item
          path: work-item

      - name: Run this reviewer, reading the pull request's tree as data
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/bin:/osf-bin:ro"
          -v "${{ github.workspace }}/base:/base:ro"
          -v "${{ github.workspace }}/pr:/pr:ro"
          -v "${{ github.workspace }}/work-item:/work-item:ro"
          -v "${{ github.workspace }}/out:/out"
          -w /pr
          -e OPENROUTER_API_KEY
          ${{ env.REVIEW_IMAGE }}
          /osf-bin/osf review run
          --reviewer opencode
          --if-enabled
          --base ${{ github.event.pull_request.base.sha }}
          --config-root /base
          --pull-request /out/pull-request.json
          --repository ${{ github.repository }}
          --pull-request-number ${{ github.event.pull_request.number }}
          --head ${{ github.event.pull_request.head.sha }}
          --ci-run-id ${{ github.run_id }}
          --work-item /work-item/work-item.json
          --out /out/opencode.json

      - name: Keep this reviewer's saved answers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-run-opencode
          path: out/opencode.json
          if-no-files-found: ignore

  review:
    name: review
    # The last job: it collects every reviewer's saved answers, checks the
    # findings against the pull request's files, decides, and posts. It
    # holds no provider key. It alone mints the code host's token. It runs
    # even when a reviewer job failed: a reviewer with no saved answers
    # counts as could-not-run, which never passes.
    needs: [build, review-codex, review-claude, review-opencode]
    if: ${{ always() && needs.build.result == 'success' && (github.event.pull_request.head.repo.full_name == github.repository || vars.OSF_REVIEW_FORKS == 'true') }}
    runs-on: ${{ fromJSON(vars.OSF_REVIEW_RUNS_ON || '"ubuntu-latest"') }}
    environment: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'review' || 'fork-review' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Restrict this job's outbound network access
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443

      - name: Require the Linux runner with Docker this workflow assumes
        if: runner.os != 'Linux'
        run: |
          echo "osf review: OSF_REVIEW_RUNS_ON must name a Linux runner; every step after this one assumes docker run and Unix paths such as /base and /pr" >&2
          exit 1

      - name: Log in to ghcr.io to pull the devcontainer image
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check out the base branch, which holds the trusted configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the pull request's head, as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the base commit into the pull request's own checkout
        run: git -C pr fetch --quiet ${{ github.workspace }}/base ${{ github.event.pull_request.base.sha }}

      - name: Fetch the osf that the build job made
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: osf-binary
          path: bin

      - name: Fetch every reviewer's saved answers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: review-run-*
          path: out/runs
          merge-multiple: true

      - name: Make a writable folder for the review's own output
        run: |
          mkdir -p out/runs
          chmod +x bin/osf

      - name: Mint the verifier's own token
        id: verifier-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.VERIFIER_APP_ID }}
          private-key: ${{ secrets.VERIFIER_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: read

      # `pr` and `base` are mounted read-only: the pull request's tree is
      # data, never a place this job writes to.
      - name: Decide the review and post it
        env:
          GH_TOKEN: ${{ steps.verifier-token.outputs.token }}
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do
            files+=("/out/${file#out/}")
          done < <(find out/runs -type f -name '*.json' -print0 | sort -z)
          docker run --rm \
            -v "${{ github.workspace }}/bin:/osf-bin:ro" \
            -v "${{ github.workspace }}/base:/base:ro" \
            -v "${{ github.workspace }}/pr:/pr:ro" \
            -v "${{ github.workspace }}/out:/out" \
            -w /pr \
            -e GH_TOKEN \
            -e OSF_STATE_DIR=/out/state \
            ${{ env.REVIEW_IMAGE }} \
            /osf-bin/osf review reduce \
            --base ${{ github.event.pull_request.base.sha }} \
            --config-root /base \
            --repository ${{ github.repository }} \
            --pull-request-number ${{ github.event.pull_request.number }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --ci-run-id ${{ github.run_id }} \
            --sarif-out /out/review.sarif \
            --post-to ${{ github.repository }}#${{ github.event.pull_request.number }} \
            "${files[@]}"

      - name: Keep the review findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-findings
          path: out/review.sarif
          if-no-files-found: ignore

  review-fork-disabled:
    name: review
    # GitHub creates a missing environment on demand, with no protection
    # at all. Gating on the `fork-review` environment alone would let an
    # adopter who never set it up run a fork's pull request anyway, with
    # whatever secrets that auto-created environment inherits. This job
    # instead requires an explicit repository variable, and fails loudly
    # rather than skipping, so a fork's pull request cannot pass this
    # check by leaving fork review unconfigured.
    if: github.event.pull_request.head.repo.full_name != github.repository && vars.OSF_REVIEW_FORKS != 'true'
    runs-on: ${{ fromJSON(vars.OSF_REVIEW_RUNS_ON || '"ubuntu-latest"') }}
    permissions: {}
    steps:
      # Blocks this job's own outbound network access; there is nothing
      # this job needs to reach, so every endpoint stays blocked.
      - name: Restrict this job's outbound network access
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block

      - name: Fail because fork review is not enabled
        run: |
          echo "review: could-not-run, fork review is not enabled (set OSF_REVIEW_FORKS to true and protect the fork-review environment)"
          exit 1
