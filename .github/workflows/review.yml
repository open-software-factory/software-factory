name: review

# The caller of the review check. pull_request_target always runs this file
# from the base branch, so a pull request cannot change it. The local path
# below is read at that same base commit, so osf's own pull requests are judged
# by the review check on the base branch, built from the base commit.
# The job logic lives in review-check.yml. An adopter's caller names that file
# in this repository by a full commit SHA instead; docs/development.md says how.
#
# This check is advisory. It posts a check run and a review, and no branch
# protection or ruleset requires it.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  review:
    # The called workflow can only narrow these permissions. They are the
    # union of what its jobs ask for.
    permissions:
      contents: read
      packages: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/review-check.yml
    with:
      osf-repository: ${{ github.repository }}
      osf-ref: ${{ github.event.pull_request.base.sha }}
      runs-on: ${{ vars.OSF_REVIEW_RUNS_ON || '"ubuntu-latest"' }}
      verifier-app-id: ${{ vars.VERIFIER_APP_ID }}
      allow-forks: ${{ vars.OSF_REVIEW_FORKS == 'true' }}
