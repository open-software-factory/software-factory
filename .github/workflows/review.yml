name: review

# pull_request_target always runs this file from the base branch, so a
# pull request cannot change the job that judges it.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    # A same-repository pull request still runs its review job on a
    # workflow the pull request cannot change (pull_request_target), but
    # the job itself can read every repository secret. The `review`
    # environment holds the secrets this job reads, and only main can
    # deploy to it, so a branch cannot widen what a review run can see.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.OSF_REVIEW_RUNS_ON || '"ubuntu-latest"') }}
    environment: review
    permissions:
      contents: read
      packages: read
    steps:
      # Blocks this job's own outbound network to the hosts below; runs
      # directly on the runner (no job-level container), so this actually
      # covers every step's own network calls, including from docker run.
      - name: Restrict this job's outbound network access
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443
            api.openai.com:443
            api.anthropic.com:443
            api.deepseek.com:443

      - name: Log in to ghcr.io to pull the devcontainer image
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check out the base branch, the only code this job runs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: base
          fetch-depth: 0

      - name: Check out the pull request's head, as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: pr
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build osf from the base branch only, with no cache
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/base:/base"
          -w /base
          ghcr.io/open-software-factory/devcontainer:main
          cargo build --release --bin osf

      - name: Mint the verifier's own token
        id: verifier-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.VERIFIER_APP_ID }}
          private-key: ${{ secrets.VERIFIER_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: read

      - name: Fetch the base commit into the pull request's own checkout
        run: git -C pr fetch --quiet ${{ github.workspace }}/base ${{ github.event.pull_request.base.sha }}

      - name: Make a writable folder for the review's own output
        run: mkdir -p "${{ github.workspace }}/out"

      # Reviewer API keys, if any, are the adopter's own secrets; osf reads none of them.
      # `pr` is mounted read-only: the pull request's tree is data, never a
      # place this job writes to. `base` stays writable, the same mount the
      # build step above already wrote `target/release/osf` into.
      - name: Run the review, reading the pull request's tree as data
        env:
          GH_TOKEN: ${{ steps.verifier-token.outputs.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/base:/base"
          -v "${{ github.workspace }}/pr:/pr:ro"
          -v "${{ github.workspace }}/out:/out"
          -w /pr
          -e GH_TOKEN
          -e OPENAI_API_KEY
          -e ANTHROPIC_API_KEY
          -e DEEPSEEK_API_KEY
          -e OSF_STATE_DIR=/out/state
          ghcr.io/open-software-factory/devcontainer:main
          /base/target/release/osf review run
          --base ${{ github.event.pull_request.base.sha }}
          --config-root /base
          --sarif-out /out/review.sarif
          --post-to ${{ github.repository }}#${{ github.event.pull_request.number }}

      - name: Keep the review findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-findings
          path: out/review.sarif
          if-no-files-found: ignore

  review-fork:
    name: review (fork)
    # A fork's pull request runs only once a maintainer approves this
    # environment, and only main can deploy to it, the same as `review`.
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ fromJSON(vars.OSF_REVIEW_RUNS_ON || '"ubuntu-latest"') }}
    environment: fork-review
    permissions:
      contents: read
      packages: read
    steps:
      # Blocks this job's own outbound network to the hosts below; runs
      # directly on the runner (no job-level container), so this actually
      # covers every step's own network calls, including from docker run.
      - name: Restrict this job's outbound network access
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443
            api.openai.com:443
            api.anthropic.com:443
            api.deepseek.com:443

      - name: Log in to ghcr.io to pull the devcontainer image
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check out the base branch, the only code this job runs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: base
          fetch-depth: 0

      - name: Check out the pull request's head, as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: pr
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build osf from the base branch only, with no cache
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/base:/base"
          -w /base
          ghcr.io/open-software-factory/devcontainer:main
          cargo build --release --bin osf

      - name: Mint the verifier's own token
        id: verifier-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.VERIFIER_APP_ID }}
          private-key: ${{ secrets.VERIFIER_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: read

      - name: Fetch the base commit into the pull request's own checkout
        run: git -C pr fetch --quiet ${{ github.workspace }}/base ${{ github.event.pull_request.base.sha }}

      - name: Make a writable folder for the review's own output
        run: mkdir -p "${{ github.workspace }}/out"

      # Reviewer API keys, if any, are the adopter's own secrets; osf reads none of them.
      # `pr` is mounted read-only: the pull request's tree is data, never a
      # place this job writes to. `base` stays writable, the same mount the
      # build step above already wrote `target/release/osf` into.
      - name: Run the review, reading the pull request's tree as data
        env:
          GH_TOKEN: ${{ steps.verifier-token.outputs.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/base:/base"
          -v "${{ github.workspace }}/pr:/pr:ro"
          -v "${{ github.workspace }}/out:/out"
          -w /pr
          -e GH_TOKEN
          -e OPENAI_API_KEY
          -e ANTHROPIC_API_KEY
          -e DEEPSEEK_API_KEY
          -e OSF_STATE_DIR=/out/state
          ghcr.io/open-software-factory/devcontainer:main
          /base/target/release/osf review run
          --base ${{ github.event.pull_request.base.sha }}
          --config-root /base
          --sarif-out /out/review.sarif
          --post-to ${{ github.repository }}#${{ github.event.pull_request.number }}

      - name: Keep the review findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-findings
          path: out/review.sarif
          if-no-files-found: ignore
