name: review

# The caller of the review check. pull_request_target always runs this file
# from the repository's default branch, so a pull request cannot change it. A
# pull request's base can be any branch, so osf is built from the commit of
# this workflow (`github.workflow_sha`), never from the pull request's base.
# The base commit is only what the reviewers diff against.
# The job logic lives in review-check.yml, which the local path below reads at
# the same commit as this file. An adopter's caller names that file in this
# repository by a full commit SHA instead; docs/development.md says how.
#
# This check is advisory. It posts a check run and a review, and no branch
# protection or ruleset requires it.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  review:
    # The called workflow can only narrow these permissions. They are the
    # union of what its jobs ask for.
    permissions:
      contents: read
      packages: read
      issues: read
      pull-requests: read
    environment: review
    uses: ./.github/workflows/review-check.yml
    # The called jobs read the keys from the `review` environment, and GitHub
    # gives a called workflow an environment secret only when the caller passes it.
    secrets: inherit
    with:
      osf-repository: ${{ github.repository }}
      osf-ref: ${{ github.workflow_sha }}
      runs-on: ${{ vars.OSF_REVIEW_RUNS_ON || '"ubuntu-latest"' }}
      verifier-app-id: ${{ vars.VERIFIER_APP_ID }}
      allow-forks: ${{ vars.OSF_REVIEW_FORKS == 'true' }}
