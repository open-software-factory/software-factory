language: rust
tasks:
  scan-staged:
    command: 'osf check scan-staged --checkpoint pre-commit --sarif-out .osf/out/scan-staged.sarif'
    inputs: ['/**/*']
    tags: [osf-pre-commit, osf-slot-secrets]
    options: { runFromWorkspaceRoot: true, cache: false, shell: false }
  scan-hook:
    command: 'osf check scan --checkpoint hook --sarif-out .osf/out/scan-hook.sarif'
    inputs: ['/**/*']
    tags: [osf-hook, osf-slot-secrets]
    options: { runFromWorkspaceRoot: true, cache: false, shell: false }
  scan-pre-push:
    command: 'osf check scan --checkpoint pre-push --sarif-out .osf/out/scan-pre-push.sarif'
    inputs: ['/**/*']
    tags: [osf-pre-push, osf-slot-secrets]
    options: { runFromWorkspaceRoot: true, cache: false, shell: false }
  scan-gate:
    command: 'osf check scan --checkpoint pull-request --gate --sarif-out .osf/out/scan-gate.sarif'
    inputs: ['/**/*']
    tags: [osf-pull-request, osf-slot-secrets]
    options: { runFromWorkspaceRoot: true, cache: false, shell: false }
  scan-commits:
    command: 'osf check scan-commits --checkpoint pre-push --sarif-out .osf/out/scan-commits.sarif'
    inputs: ['/**/*']
    tags: [osf-pre-push, osf-slot-secrets]
    options: { runFromWorkspaceRoot: true, cache: false, shell: false }
  scan-commits-gate:
    command: 'osf check scan-commits --checkpoint pull-request --gate --sarif-out .osf/out/scan-commits-gate.sarif'
    inputs: ['/**/*']
    tags: [osf-pull-request, osf-slot-secrets]
    options: { runFromWorkspaceRoot: true, cache: false, shell: false }
  lint-writing-hook:
    command: 'osf check lint-writing --checkpoint hook --sarif-out .osf/out/lint-writing-hook.sarif'
    inputs: ['/**/*.md']
    tags: [osf-hook, osf-slot-writing]
    options: { runFromWorkspaceRoot: true, cache: false, shell: false }
  lint-writing-pre-push:
    command: 'osf check lint-writing --checkpoint pre-push --sarif-out .osf/out/lint-writing-pre-push.sarif'
    inputs: ['/**/*.md']
    tags: [osf-pre-push, osf-slot-writing]
    options: { runFromWorkspaceRoot: true, cache: false, shell: false }
  lint-writing-gate:
    command: 'osf check lint-writing --checkpoint pull-request --gate --sarif-out .osf/out/lint-writing-gate.sarif'
    inputs: ['/**/*.md']
    tags: [osf-pull-request, osf-slot-writing]
    options: { runFromWorkspaceRoot: true, cache: false, shell: false }
  lint-skill-hook:
    command: 'osf check lint-skill --checkpoint hook --sarif-out .osf/out/lint-skill-hook.sarif'
    inputs: ['/**/SKILL.md', '/**/skills/**/*']
    tags: [osf-hook, osf-slot-skill]
    options: { runFromWorkspaceRoot: true, cache: false, shell: false }
  lint-skill-pre-push:
    command: 'osf check lint-skill --checkpoint pre-push --sarif-out .osf/out/lint-skill-pre-push.sarif'
    inputs: ['/**/SKILL.md', '/**/skills/**/*']
    tags: [osf-pre-push, osf-slot-skill]
    options: { runFromWorkspaceRoot: true, cache: false, shell: false }
  lint-skill-gate:
    command: 'osf check lint-skill --checkpoint pull-request --gate --sarif-out .osf/out/lint-skill-gate.sarif'
    inputs: ['/**/SKILL.md', '/**/skills/**/*']
    tags: [osf-pull-request, osf-slot-skill]
    options: { runFromWorkspaceRoot: true, cache: false, shell: false }
  fmt:
    command: 'cargo fmt --all --check'
    inputs: ['/**/*.rs']
    tags: [osf-pre-commit, osf-pull-request, osf-slot-format]
    options: { runFromWorkspaceRoot: true, shell: false }
  clippy:
    command: 'cargo clippy --workspace --all-targets -- -D warnings'
    inputs: ['/**/*.rs', '/Cargo.toml', '/Cargo.lock', '/crates/*/Cargo.toml']
    tags: [osf-pre-push, osf-pull-request, osf-slot-lint]
    options: { runFromWorkspaceRoot: true, shell: false }
  test:
    command: 'cargo test --workspace'
    inputs: ['/**/*.rs', '/Cargo.toml', '/Cargo.lock', '/crates/*/Cargo.toml', '/crates/*/tests/fixtures/**/*']
    deps: ['~:clippy']
    tags: [osf-pre-push, osf-pull-request, osf-slot-unit-tests]
    options: { runFromWorkspaceRoot: true, shell: false }
