<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 957 353" width="957" height="353" role="img" aria-label="Commit under the workspace" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif">
<title>Commit under the workspace</title>
<desc>The ordered path a workspace commit takes through the wrapper and the forced factory hooks.</desc>
