<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1284 418" width="1284" height="418" role="img" aria-label="Binding check" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif">
<title>Binding check</title>
<desc>How a saved work item is validated against the pull request text before a reviewer lens consumes it.</desc>
