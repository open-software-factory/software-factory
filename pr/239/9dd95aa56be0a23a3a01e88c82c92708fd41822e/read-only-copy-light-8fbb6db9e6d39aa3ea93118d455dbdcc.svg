<rect class="chip" x="46" y="110" width="26" height="26" rx="7" fill="#f1f3f5"/><g><text class="glyph" x="59" y="127.5" text-anchor="middle" fill="#59636e" font-size="14" font-style="italic" font-family="Georgia,serif">ƒ</text></g>
<text class="ntitle" x="82" y="119" font-size="13" font-weight="600" fill="#1f2328">run_lens()</text>
<text class="nsub" x="82" y="137" font-size="9.5" fill="#59636e" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace">one lens, one read-only copy</text>
<g class="bdg bdg-added"><rect x="356.45" y="84" width="40.55" height="16" rx="8" fill="#b9f0c4" stroke="rgba(31,136,61,.55)" stroke-width="1"/><text x="376.73" y="95" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing=".06em" fill="#116329">NEW</text></g></g>
<g class="cardsh context" filter="drop-shadow(0 1px 2px rgba(31,35,40,.14))" opacity="0.82"><rect class="card" x="456" y="92" width="372" height="62" rx="10" fill="#ffffff" stroke-width="1" stroke="#d1d9e0"/>
<rect class="chip" x="470" y="110" width="26" height="26" rx="7" fill="#f1f3f5"/><g><rect class="glyph-stroke" x="475" y="117" width="16" height="12" rx="2" stroke="#59636e" stroke-width="1.4" fill="none"/>
<path class="glyph-stroke" d="M475,119 l8,6 8,-6" stroke="#59636e" stroke-width="1.4" fill="none"/></g>
<text class="ntitle" x="506" y="119" font-size="13" font-weight="600" fill="#1f2328">coding-agent CLI</text>
<text class="nsub" x="506" y="137" font-size="9.5" fill="#59636e" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace">opencode / omp / claude</text>
<g class="bdg bdg-neutral"><rect x="694.12" y="84" width="126.88" height="16" rx="8" fill="#f1f3f5" stroke="#d1d9e0" stroke-width="1"/><text x="757.56" y="95" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing=".06em" fill="#59636e">one process per attempt</text></g></g>
<g class="cardsh" filter="drop-shadow(0 1px 2px rgba(31,35,40,.14))"><rect class="card card-modified" x="880" y="206" width="372" height="62" rx="10" fill="#ffffff" stroke-width="1" stroke="#bf8700" stroke-opacity="0.5"/>
<rect class="chip" x="894" y="224" width="26" height="26" rx="7" fill="#f1f3f5"/><g><text class="glyph" x="907" y="241.5" text-anchor="middle" fill="#59636e" font-size="11" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace">{ }</text></g>
<text class="ntitle" x="930" y="233" font-size="13" font-weight="600" fill="#1f2328">CleanCopy</text>
<text class="nsub" x="930" y="251" font-size="9.5" fill="#59636e" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace">tracked + untracked files</text>
<g class="bdg bdg-neutral"><rect x="1090.14" y="198" width="82.24" height="16" rx="8" fill="#f1f3f5" stroke="#d1d9e0" stroke-width="1"/><text x="1131.26" y="209" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing=".06em" fill="#59636e">0o444 / 0o555</text></g>
<g class="bdg bdg-modified"><rect x="1178.38" y="198" width="66.62" height="16" rx="8" fill="#fae17d" stroke="rgba(154,103,0,.55)" stroke-width="1"/><text x="1211.69" y="209" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing=".06em" fill="#7d4e00">CHANGED</text></g></g></g>
<g><g><rect class="lpill" x="585.07" y="172.5" width="117.86" height="15" rx="7.5" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><text class="ltext ltext-added" x="644" y="183.5" text-anchor="middle" font-size="9.5" font-weight="600" fill="#116329">create_read_only(root)</text></g>
<g><rect class="lpill" x="795.47" y="166" width="101.07" height="15" rx="7.5" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><text class="ltext ltext-modified" x="846" y="177" text-anchor="middle" font-size="9.5" font-weight="600" fill="#7d4e00">reads, cannot write</text></g></g>
</svg>