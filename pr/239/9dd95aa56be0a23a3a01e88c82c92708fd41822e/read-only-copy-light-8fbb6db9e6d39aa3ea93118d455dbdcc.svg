<path class="edge edge-added hero" d="M404,123 L417,123 C424.18,123 430,128.82 430,136 L430,151.5 C430,167.24 442.76,180 458.5,180 L829.5,180 C847.45,180 862,194.55 862,212.5 L862,236 C862,240.97 866.03,245 871,245 L880,245" marker-end="url(#mk-added)" fill="none" stroke="#1f883d" stroke-width="2.25"/>
<path class="edge edge-modified" d="M828,123 L837,123 C841.97,123 846,127.03 846,132 L846,212 C846,221.39 853.61,229 863,229 L880,229" marker-end="url(#mk-modified)" fill="none" stroke="#bf8700" stroke-width="1.5"/></g>
