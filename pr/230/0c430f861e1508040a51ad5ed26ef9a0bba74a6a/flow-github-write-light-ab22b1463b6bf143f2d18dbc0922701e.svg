<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1284 505" width="1284" height="505" role="img" aria-label="GitHub blocked-state write" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif">
<title>GitHub blocked-state write</title>
<desc>Adds a new `work_tracker` module to the osf crate: a provider-neutral `WorkTracker` trait (read items, write state, write recap, report capabilities) with its data types, a pure 'Ready' dispatch rule, a run-finishing helper that checks capabilities before writing state then recap, and an in-memory fake double. On top of that seam it adds the first real adapter, `github_work_tracker`, which drives GitHub Issues and Projects v2 through the `gh` CLI: pure argv/payload builders, pure response parsers, a `RealGhRunner` with timeout and explicit-token identity, and a refusal to write without an explicit builder identity. Three integration tests pin the fake run, the provider-neutrality of the seam, and the real runner's process behaviour.</desc>
