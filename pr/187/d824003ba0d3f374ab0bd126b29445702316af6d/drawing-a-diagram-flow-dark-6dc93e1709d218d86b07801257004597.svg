<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3504 467" width="3504" height="467" role="img" aria-label="Drawing a diagram" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif">
<title>Drawing a diagram</title>
<desc>Adds three review aids that write into a pull request's own description: a pr-lens workflow that diagrams the diff, a pr-outline skill that writes a change outline, and a show-me skill for picking the smallest diagram. Two existing workflows, git-town and status-block, gain a fork-safe skip because a fork pull request only gets a read-only token.</desc>
