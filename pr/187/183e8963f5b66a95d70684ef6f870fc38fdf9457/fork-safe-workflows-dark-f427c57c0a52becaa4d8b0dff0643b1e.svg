<g><g><rect class="lpill" x="395.42" y="170" width="69.17" height="15" rx="7.5" fill="#0d1117" stroke="#21262d" stroke-width="1"/><text class="ltext" x="430" y="181" text-anchor="middle" font-size="9.5" font-weight="600" fill="#9198a1">status block</text></g></g>
