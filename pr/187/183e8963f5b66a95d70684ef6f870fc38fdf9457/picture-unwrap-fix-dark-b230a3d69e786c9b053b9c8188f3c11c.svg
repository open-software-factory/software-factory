<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 294" width="860" height="294" role="img" aria-label="The picture-unwrap fix" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif">
<title>The picture-unwrap fix</title>
<desc>osf pr section write now strips a link around a lone &lt;picture&gt;, so a pr-lens diagram keeps its dark-mode source instead of always rendering light.</desc>
