<circle r="2.6" fill="#3fb950" opacity="0"><animateMotion dur="9.8s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0;0.1429;1" calcMode="linear" path="M128,123 L421,123"/><animate attributeName="opacity" dur="9.8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0;0.0114;0.1314;0.1429;1"/></circle>
