<path class="msg edge-added msg-strong" d="M128,237 h52 a7,7 0 0 1 7,7 v6 a7,7 0 0 1 -7,7 h-47" marker-end="url(#mk-added)" fill="none" stroke="#3fb950" stroke-width="2.25"/>
