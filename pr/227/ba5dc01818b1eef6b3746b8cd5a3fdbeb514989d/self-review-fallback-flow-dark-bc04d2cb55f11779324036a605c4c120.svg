<g><g><rect class="lpill" x="142.13" y="115.5" width="264.74" height="15" rx="7.5" fill="#0d1117" stroke="#21262d" stroke-width="1"/><text class="ltext ltext-added" x="274.5" y="126.5" text-anchor="middle" font-size="9.5" font-weight="600" fill="#3fb950">api -X POST .../reviews (event=REQUEST_CHANGES)</text></g>
