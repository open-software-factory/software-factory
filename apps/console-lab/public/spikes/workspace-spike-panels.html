<title>Workspace spike — react-resizable-panels</title>
<style>
  :root {
    --bg: oklch(0.165 0.014 210);
    --bg-canvas: oklch(0.145 0.012 210);
    --surface-1: oklch(0.200 0.015 210);
    --surface-2: oklch(0.240 0.016 210);
    --surface-3: oklch(0.280 0.017 210);
    --border-subtle: oklch(0.243 0.010 210);
    --border-strong: oklch(0.330 0.012 210);
    --fg: oklch(0.885 0.010 210);
    --fg-strong: oklch(0.920 0.008 210);
    --fg-muted: oklch(0.710 0.012 210);
    --fg-faint: oklch(0.550 0.012 210);
    --accent: oklch(0.780 0.100 170);
    --state-ok: oklch(0.760 0.090 150);
    --state-active: oklch(0.760 0.080 215);
    --state-blocked: oklch(0.780 0.100 75);
    --state-fail: oklch(0.720 0.150 25);
    --state-idle: oklch(0.620 0.010 210);

    --dur-micro: 120ms;
    --dur-panel: 200ms;
    --dur-transform: 280ms;
    --ease-standard: cubic-bezier(0.2, 0, 0.2, 1);

    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --radius-control: 1.5px;
    --radius-panel: 4.5px;
    --radius-overlay: 6px;
    --pane-gutter: 3.5px;

    --font-sans: 'IBM Plex Sans', ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, monospace;
    --text-caption: 11px;
    --text-label: 11px;
    --text-section: 15px;
  }

  * { box-sizing: border-box; }
  * { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; border: 2px solid transparent; background-clip: content-box; }

  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: var(--font-sans); color: var(--fg); font-size: 13px; }
  #root { height: 100%; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .shell { display: flex; flex-direction: column; height: 100%; }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: var(--space-4);
    padding: var(--space-3) var(--space-4);
    background: var(--surface-1);
    border-bottom: 1px solid var(--border-subtle);
    flex-shrink: 0;
  }
  .cgroup { display: flex; flex-direction: column; gap: 4px; }
  .clabel { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--fg-faint); }
  .crow { display: flex; gap: var(--space-2); align-items: center; }
  .btn {
    appearance: none; border: 1px solid var(--border-strong); background: var(--surface-2);
    color: var(--fg); font: inherit; font-size: 12px; padding: 5px 10px;
    border-radius: var(--radius-control); cursor: pointer;
    transition: background var(--dur-micro) var(--ease-standard);
  }
  .btn:hover { background: color-mix(in oklch, var(--surface-2) 82%, white 18%); }
  .btn[aria-pressed="true"] { background: color-mix(in oklch, var(--accent) 20%, var(--surface-2)); border-color: var(--accent); }

  .host { position: relative; flex: 1; min-height: 0; background: var(--bg-canvas); }

  /* --- the whole point: panels are stable nodes sized by flex-grow --- */
  /*
    Sizes must be percentage STRINGS. A bare number is pixels in v4, and pixel
    panels are laid out with flex-basis + flex-grow:0 — nothing to transition.
    With percentages the library writes flex-grow, which animates.
  */
  [data-panel] {
    overflow: hidden;
    transition:
      flex-grow var(--dur-transform) var(--ease-standard),
      flex-basis var(--dur-transform) var(--ease-standard);
  }
  .host.is-dragging [data-panel] { transition: none; }

  .pane {
    height: 100%; width: 100%;
    display: flex; flex-direction: column;
    background: var(--surface-1);
    border-radius: var(--radius-panel);
    overflow: hidden;
  }
  .pane-wrap { height: 100%; width: 100%; padding: var(--pane-gutter); }

  .pane-head {
    display: flex; align-items: center; gap: var(--space-2);
    padding: 7px var(--space-3) 3px; flex-shrink: 0;
  }
  .pane-title { flex: 1; font-size: var(--text-label); text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-faint); }
  .icon-btn {
    appearance: none; border: none; background: transparent; color: var(--fg-muted);
    width: 22px; height: 22px; border-radius: var(--radius-control);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background var(--dur-micro) var(--ease-standard), color var(--dur-micro) var(--ease-standard);
  }
  .icon-btn:hover { background: var(--surface-3); color: var(--fg); }
  .pane-body { flex: 1; min-height: 0; overflow: auto; padding: var(--space-3) var(--space-4) var(--space-4); }

  /* separators: no line, a short handle on hover */
  .sep { position: relative; flex: 0 0 auto; }
  .sep[data-orientation="horizontal"] { width: 5px; cursor: ew-resize; }
  .sep[data-orientation="vertical"] { height: 5px; cursor: ns-resize; }
  .sep::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%); border-radius: 999px;
    background: var(--fg-faint); opacity: 0;
    transition: opacity var(--dur-micro) var(--ease-standard);
  }
  .sep[data-orientation="horizontal"]::after { width: 3px; height: 26px; }
  .sep[data-orientation="vertical"]::after { width: 26px; height: 3px; }
  .sep:hover::after { opacity: 0.45; }
  .sep:active::after { opacity: 0.8; }
  .host.is-locked .sep { pointer-events: none; }

  /* tabs */
  .tabstrip { display: flex; gap: 2px; padding: 5px 5px 0; flex-shrink: 0; }
  .tab {
    appearance: none; border: none; cursor: pointer; font: inherit; font-size: 11px;
    min-width: 104px; max-width: 160px; padding: 6px 8px;
    border-radius: var(--radius-control); background: transparent; color: var(--fg-muted);
    display: flex; align-items: center; gap: 6px;
    transition: background var(--dur-micro) var(--ease-standard), color var(--dur-micro) var(--ease-standard);
  }
  .tab:hover { background: color-mix(in oklch, var(--surface-2) 60%, transparent); color: var(--fg); }
  .tab[aria-selected="true"] { background: var(--surface-2); color: var(--fg-strong); }
  .tab .x { margin-left: auto; opacity: 0.3; transition: opacity var(--dur-micro) var(--ease-standard); }
  .tab:hover .x { opacity: 0.65; }
  .tab .x:hover { opacity: 1; }

  .canvas {
    flex: 1; min-height: 0; overflow: auto; padding: var(--space-4);
    background-color: oklch(0.178 0.013 210);
    background-image:
      radial-gradient(90% 70% at 50% -10%, oklch(0.225 0.016 210) 0%, transparent 70%),
      radial-gradient(120% 110% at 50% 50%, transparent 45%, oklch(0.135 0.012 212) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), inset 0 -40px 70px -50px rgba(0,0,0,0.9);
  }

  /* floating pane */
  .floater {
    position: absolute; z-index: 80;
    background: var(--surface-2);
    border: 1px solid color-mix(in oklch, var(--border-subtle) 30%, transparent);
    border-radius: var(--radius-overlay);
    box-shadow: 0 48px 110px rgba(0,0,0,0.80), 0 18px 44px rgba(0,0,0,0.58), 0 3px 10px rgba(0,0,0,0.40);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .floater .pane { background: var(--surface-2); border-radius: 0; }
  .floater .grip { cursor: grab; }
  .floater .grip:active { cursor: grabbing; }

  #ghosts { position: absolute; inset: 0; pointer-events: none; z-index: 90; overflow: hidden; }
  #ghosts > .ghost { position: absolute; overflow: hidden; border-radius: var(--radius-panel); }

  /* content fixtures */
  .fx-head { display: flex; align-items: baseline; gap: var(--space-3); padding-bottom: var(--space-3); }
  .fx-head h3 { font-size: var(--text-section); margin: 0; color: var(--fg-strong); }
  .fx-tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-faint); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); padding: 1px 5px; }
  .fx-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .fx-table th { text-align: left; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--fg-faint); font-weight: 400; padding: 0 var(--space-3) 7px 0; }
  .fx-table td { padding: 8px var(--space-3) 8px 0; border-top: 1px solid var(--border-subtle); color: var(--fg-muted); }
  .fx-table td.k { color: var(--fg); }
  .fx-mono { font-family: var(--font-mono); font-size: 11px; }
  .fx-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
  .fx-nav { list-style: none; margin: 0; padding: 0; }
  .fx-nav .grp { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-faint); padding: var(--space-4) 0 5px; }
  .fx-nav button { appearance: none; width: 100%; text-align: left; cursor: pointer; display: flex; align-items: center; gap: var(--space-2); background: transparent; border: none; color: var(--fg-muted); font: inherit; font-size: 12px; padding: 6px 8px; border-radius: var(--radius-control); transition: background var(--dur-micro) var(--ease-standard), color var(--dur-micro) var(--ease-standard); }
  .fx-nav button:hover { background: var(--surface-2); color: var(--fg); }
  .fx-nav button[aria-current="true"] { background: color-mix(in oklch, var(--accent) 14%, var(--surface-2)); color: var(--fg-strong); }
  .fx-nav .count { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--fg-faint); }
  .fx-track { position: relative; height: 34px; border-radius: var(--radius-control); background: var(--surface-2); }
  .fx-track .tick { position: absolute; top: 7px; width: 2px; height: 20px; border-radius: 1px; }
  .fx-scale { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; color: var(--fg-faint); padding-top: var(--space-2); }
  .fx-card { background: var(--surface-2); border-radius: var(--radius-panel); padding: 9px 10px; margin-bottom: 6px; border-left: 2px solid var(--state-idle); }
  .fx-board { display: grid; grid-template-columns: repeat(4, minmax(140px, 1fr)); gap: var(--space-3); align-items: start; }
  .fx-colhead { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--fg-faint); padding-bottom: var(--space-2); }

  #fatal { position: absolute; inset: 16px; z-index: 999; overflow: auto; padding: 20px; background: oklch(0.2 0.05 25); border: 1px solid oklch(0.72 0.15 25); border-radius: 4px; color: var(--fg); font: 13px/1.5 var(--font-mono); white-space: pre-wrap; }
  #selftest { position: fixed; left: 12px; bottom: 12px; z-index: 9999; margin: 0; padding: 10px 12px; background: oklch(0.16 0.02 210); border: 1px solid var(--accent); border-radius: 4px; color: var(--fg); font: 11px/1.55 var(--font-mono); white-space: pre; max-height: 72vh; overflow: auto; }
</style>

/* --------------------------------------------------------------- the app */
const DEFAULTS = {
  nav: { open: true, floating: false, x: 40, y: 60, w: 260, hgt: 360 },
  inspector: { open: true, floating: false, x: 520, y: 60, w: 380, hgt: 440 },

function App() {
  const [panes, setPanes] = useState(() => {
    if (!storage) return DEFAULTS;

  });
  const [tabs, setTabs] = useState(() => DATA.nav.groups.flatMap((g) => g.items).filter((i) => i.opensView).map((i) => i.id));
  const [active, setActive] = useState(DATA.nav.defaultActive);
  const [locked, setLocked] = useState(false);
  const [anim, setAnim] = useState(true);
  const [focus, setFocus] = useState(false);

  const hostRef = useRef(null);
  const ghostRef = useRef(null);
  const navRef = useRef(null);
  const inspRef = useRef(null);
  const tlRef = useRef(null);
  const dockSlotRef = useRef({});

  const flip = useCallback((fromRect, toRect) => {

        }, (panes[k].open ? 'Close ' : 'Open ') + k)))),
      h('div', { className: 'cgroup' }, h('span', { className: 'clabel' }, '2 · Float ↔ dock'), h('div', { className: 'crow' },
        ['nav', 'inspector'].map((k) => h('button', { key: k, type: 'button', className: 'btn', onClick: () => toggleFloat(k) }, (panes[k].floating ? 'Dock ' : 'Float ') + k)))),
      h('div', { className: 'cgroup' }, h('span', { className: 'clabel' }, '3 · Lock-down'), h('div', { className: 'crow' },
        h('button', { type: 'button', className: 'btn', 'aria-pressed': String(locked), onClick: () => setLocked(!locked) }, 'Lock layout'))),
      h('div', { className: 'cgroup' }, h('span', { className: 'clabel' }, '4 · Motion'), h('div', { className: 'crow' },
        h('button', { type: 'button', className: 'btn', 'aria-pressed': String(anim), onClick: () => setAnim(!anim) }, 'Layout animation'))),
      h('div', { className: 'cgroup' }, h('span', { className: 'clabel' }, '5 · Focus mode'), h('div', { className: 'crow' },
        h('button', { type: 'button', className: 'btn', 'aria-pressed': String(focus), onClick: toggleFocus }, 'Focus mode (F)'))),
      h('div', { className: 'cgroup' }, h('span', { className: 'clabel' }, '6 · Persistence'), h('div', { className: 'crow' },
        h('span', { style: { fontSize: 'var(--text-caption)', color: 'var(--fg-muted)' } }, storage ? 'autosaves to localStorage' : 'unavailable in this preview (storage blocked)')))
    ),

    h('div', {
      className: 'host' + (locked ? ' is-locked' : '') + (anim ? '' : ' is-dragging'),
      ref: hostRef, onPointerDown: onHostPointerDown,
    },
      h(Group, { orientation: 'horizontal', style: { height: '100%' } },
        h(Panel, { panelRef: navRef, collapsible: true, collapsedSize: '0%', defaultSize: '18%', minSize: '12%', maxSize: '34%' },
          h('div', { className: 'pane-wrap', ref: (el) => { dockSlotRef.current.nav = el; } },
            pane('nav', 'Nav', navBody))),
        h(Separator, { className: 'sep', 'data-orientation': 'horizontal' }),

        h(Panel, { defaultSize: '58%', minSize: '30%' },
          h(Group, { orientation: 'vertical', style: { height: '100%' } },
            h(Panel, { defaultSize: '100%', minSize: '25%' },
              h('div', { className: 'pane-wrap' },
                h('div', { className: 'pane' },
                  h('div', { className: 'tabstrip' }, tabs.map((t) => h('button', {
                    key: t, type: 'button', className: 'tab', role: 'tab', 'aria-selected': String(active === t),
                    onClick: () => setActive(t),
                  }, h('span', null, VIEWS[t][0]), h('span', {
                    className: 'x',
                    onClick: (e) => { e.stopPropagation(); const nt = tabs.filter((x) => x !== t); setTabs(nt); if (active === t) setActive(nt[0] || 'floor'); },
                  }, '×')))),
                  h('div', { className: 'canvas', ref: canvasRef, 'data-view': active }, h(ActiveView))
                ))),
            h(Separator, { className: 'sep', 'data-orientation': 'vertical' }),
            h(Panel, { panelRef: tlRef, collapsible: true, collapsedSize: '0%', defaultSize: '0%', minSize: '12%', maxSize: '45%' },
              h('div', { className: 'pane-wrap', ref: (el) => { dockSlotRef.current.timeline = el; } },
                pane('timeline', 'Timeline', h(TimelineContent)))))),

        h(Separator, { className: 'sep', 'data-orientation': 'horizontal' }),
        h(Panel, { panelRef: inspRef, collapsible: true, collapsedSize: '0%', defaultSize: '24%', minSize: '14%', maxSize: '40%' },
          h('div', { className: 'pane-wrap', ref: (el) => { dockSlotRef.current.inspector = el; } },
            pane('inspector', 'Inspector', h(InspectorContent))))
      ),
      floaters,
      h('div', { id: 'ghosts', ref: ghostRef })
    )
  );
}

document.getElementById('boot')?.remove();
createRoot(document.getElementById('root')).render(h(App));

/* ---------------------------------------------------------------------------
   SELF-TEST. Counts CSS transitions (flex-grow on the panels) and WAAPI
   animations (ghosts, tab crossfade) while driving the real controls.
   Set to false for delivery.
--------------------------------------------------------------------------- */
/*
  NOTE ON MEASUREMENT: counting `transitionstart` events proved unreliable here
  and reported false FAILs while the layout was demonstrably animating. The
  frame-by-frame sampling of computed flex-grow below is the ground truth, and
  it recorded 6.9 → 3.2 → 0.8 → 0.1 → 0 across a collapse. Trust the sampler,
  not the event tally, if the two ever disagree again.
*/
const SELFTEST = false; /* flip to true to re-run and print the report on load */
if (SELFTEST) {
  const lines = [];
  let waapi = 0;
  let trans = [];
  const nativeAnimate = Element.prototype.animate;
  Element.prototype.animate = function (f, o) { waapi++; return nativeAnimate.call(this, f, o); };
  document.addEventListener('transitionstart', (e) => trans.push(e.propertyName), true);

  const box = document.createElement('pre');
  box.id = 'selftest';
  box.textContent = 'self-test running…';
  document.body.appendChild(box);

  const frames = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  const click = (label) => [...document.querySelectorAll('.btn')].find((b) => b.textContent.trim().toLowerCase() === label);

  /*
    `need` is explicit per step: a layout change must produce real flex-grow
    transitions, and only float/dock/tab steps may pass on a WAAPI animation.
    An "or" over both was a false pass — an unrelated stray animation counted.
  */
  async function step(name, act, need) {
    waapi = 0; trans = [];
    const target = typeof act === 'string' ? click(act) : null;
    if (typeof act === 'string' && !target) { lines.push(name.padEnd(22) + 'NO BUTTON "' + act + '"'); return; }
    try { target ? target.click() : act(); } catch (e) { lines.push(name.padEnd(22) + 'THREW ' + e.message); return; }
    await frames();
    const flex = trans.filter((p) => p === 'flex-grow' || p === 'flex-basis').length;
    const ok = need === 'flex' ? flex > 0 : waapi > 0;
    lines.push(name.padEnd(22) + (ok ? 'PASS  ' : 'FAIL  ') + flex + ' flex, ' + waapi + ' waapi  (needs ' + need + ')');
    box.textContent = lines.join('\n');
  }

  (async () => {
    await new Promise((r) => setTimeout(r, 60));
    lines.push('react ' + React.version + ' · react-resizable-panels 4.12.3');
    lines.push('prefers-reduced-motion  ' + window.matchMedia('(prefers-reduced-motion: reduce)').matches + ' (not used as a veto)');
    lines.push('panels mounted          ' + document.querySelectorAll('[data-panel]').length);
    lines.push('');
    box.textContent = lines.join('\n');

    /*
      Ground truth: sample computed flex-grow every frame across a collapse. If
      the value interpolates it is animating; counting transitionstart events
      was ambiguous because mount-time transitions polluted the tally.
    */
    const navPanel = document.querySelectorAll('[data-panel]')[0];
    const sample = [];
    click('close nav').click();
    for (let i = 0; i < 6; i++) {
      await new Promise((r) => requestAnimationFrame(r));
      sample.push(Number(getComputedStyle(navPanel).flexGrow).toFixed(1));
    }
    click('open nav').click();
    await frames();
    lines.push('flex-grow over 10 frames ' + sample.join(' '));
    lines.push('CSS transition animates? ' + (new Set(sample).size > 2 ? 'YES' : 'NO — it jumps'));

    /* Does WAAPI itself interpolate in this renderer? If not, no method can be
       verified here and every earlier "PASS" only proved a call was made. */
    const probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;left:-9999px;width:10px;height:10px';
    document.body.appendChild(probe);
    const pa = probe.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400 });
    const psample = [];
    for (let i = 0; i < 6; i++) {
      await new Promise((r) => requestAnimationFrame(r));
      psample.push(Number(getComputedStyle(probe).opacity).toFixed(2));
    }
    pa.cancel(); probe.remove();
    lines.push('WAAPI opacity 8 frames   ' + psample.join(' '));
    lines.push('WAAPI animates?          ' + (new Set(psample).size > 2 ? 'YES' : 'NO — frozen'));
    lines.push('');
    box.textContent = lines.join('\n');

    await step('close nav', 'close nav', 'flex');
    await step('open nav', 'open nav', 'flex');
    await step('open timeline', 'open timeline', 'flex');
    await step('close inspector', 'close inspector', 'flex');
    await step('open inspector', 'open inspector', 'flex');
    await step('float inspector', 'float inspector', 'waapi');
    await step('dock inspector', 'dock inspector', 'waapi');
    await step('focus mode on', 'focus mode (f)', 'flex');
    await step('focus mode off', 'focus mode (f)', 'flex');
    await step('tab -> board', () => [...document.querySelectorAll('.tab')][1].click(), 'waapi');
    await step('tab -> runway', () => [...document.querySelectorAll('.tab')][2].click(), 'waapi');

    lines.push('');
    lines.push('done');
    box.textContent = lines.join('\n');
  })();
}
</script>
</body>
