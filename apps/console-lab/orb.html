<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orb lab</title>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  function show(title, detail) {
    if (document.getElementById('fatal')) return;
    var b = document.createElement('div');
    b.id = 'fatal';
    b.textContent = title + '\n\n' + detail;
    (document.body || document.documentElement).appendChild(b);
  }
  window.addEventListener('error', function (e) { show('Runtime error', (e.error && e.error.stack) || e.message || String(e)); });
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; show('Unhandled rejection', (r && r.stack) || String(r)); });
})();
</script>

<script type="module" src="./src/orb/main.jsx"></script>
</body>
</html>
